  try{
    Object.keys(writes).forEach(k=>{old[k]=localStorage.getItem(k)});
    Object.keys(writes).forEach(k=>localStorage.setItem(k,JSON.stringify(writes[k])));
  }catch(e){
    Object.keys(old).forEach(k=>{try{if(old[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,old[k])}catch(ignore){}});
    throw new Error('Não foi possível guardar todos os dados da fusão. Liberta espaço e tenta novamente.');
  }
  sales=salesAll;shifts=shiftsAll;days=daysAll;smovs=movementsAll;
  saleMerge.added.forEach(x=>dbPut('sales/'+x.id,x));
  shiftMerge.added.forEach(x=>dbPut('shifts/'+x.id,x));
  daysAll.forEach(x=>dbPut('days/'+x.id,x));
  movementMerge.added.forEach(x=>dbPut('stockmovs/'+x.id,x));
  const result={sales:saleMerge.added.length,shifts:shiftMerge.added.length,movements:movementMerge.added.length,skippedMovements:skippedMovements,skippedCounts:skippedCounts,truncatedMovements:truncatedMovements};
  xBk=null;xBkPending=null;closeSheet();render();
  toast(result.sales+' vendas, '+result.shifts+' fechos e '+result.movements+' movimentos novos'+(result.skippedMovements||result.skippedCounts||result.truncatedMovements?' · faz nova contagem do estoque':''));
}
function bkPasswordSheet(mode){
  const exporting=mode==='export';
  openSheet(`<h3>${exporting?'Guardar cópia cifrada':'Restaurar cópia cifrada'}</h3><p class="sub" style="margin:0">${exporting?'Cria uma palavra-passe com pelo menos 8 caracteres. Vais precisar dela para restaurar a cópia; não é possível recuperá-la.':'Introduz a palavra-passe usada quando esta cópia foi criada.'}</p>
  <div class="field"><label for="bk-pass">Palavra-passe</label><input class="in txt" id="bk-pass" type="password" autocomplete="${exporting?'new-password':'current-password'}"></div>
  ${exporting?'<div class="field"><label for="bk-pass2">Repete a palavra-passe</label><input class="in txt" id="bk-pass2" type="password" autocomplete="new-password"></div>':''}
  <div class="err" id="bk-err" role="alert"></div><div class="acts"><button class="btn" data-a="closeSheet">Cancelar</button><button class="btn primary" data-a="${exporting?'x_bkexportok':'x_bkdecrypt'}">${exporting?'Guardar cópia':'Restaurar cópia'}</button></div>`);
  const input=$('#bk-pass');if(input)input.focus();
}
function bkError(message){const el=$('#bk-err');if(el)el.textContent=message;else toast(message)}
async function bkExport(password){
  try{
    const data=await bkEncrypt(JSON.stringify({app:'costas-pos',v:1,t:Date.now(),deviceId:DEVICE_ID,state:state,sales:sales,shifts:shifts,days:days,stk:stk,smovs:smovs}),password);
    await saveFileLocal({filename:'costas-pos-copia-'+dayOf(Date.now())+'.json',data:data});
    lsSet(LS+'-lastbk',Date.now());closeSheet();render();toast('Cópia cifrada guardada');
  }catch(e){if(!e||e.code!=='declined')bkError(e&&e.message?e.message:'Não foi possível cifrar ou guardar a cópia.')}
}
async function bkDecrypt(password){
  try{
    if(!xBkPending)throw new Error('Seleciona novamente o ficheiro da cópia.');
    const key=await bkKey(password,bkUnbase64(xBkPending.salt));
    const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bkUnbase64(xBkPending.iv),additionalData:new TextEncoder().encode(BK_AAD)},key,bkUnbase64(xBkPending.data));
    let backup;
    try{backup=JSON.parse(new TextDecoder().decode(data))}catch(e){throw new Error('O conteúdo da cópia não é válido.')}
    xBk=bkValidate(backup);xBkPending=null;bkOfferRestore(true);
  }catch(e){
    if(e&&e.name==='OperationError')bkError('Palavra-passe incorreta ou ficheiro danificado.');
    else bkError(e&&e.message?e.message:'Não foi possível ler a cópia.');
  }
}
function xAct(a,d){
  switch(a){
    case 'x_wa':waShare(d.from);break;
    case 'x_export':sheetExport();break;
    case 'x_printReceipt':printSale(d.id);break;
    case 'x_saveReceipt':printSaleToFolder(d.id);break;
    case 'x_printDay':printDay(d.day);break;
    case 'x_saveDay':saveDay(d.day);break;
    case 'x_printShift':printShift(d.id);break;
    case 'x_saveShift':saveShift(d.id);break;
    case 'x_printMonth':printMonthReport();break;
    case 'x_saveMonth':saveMonthReport();break;
    case 'x_dayfile':{
      const f=dayFullText();
      saveFileLocal({filename:'fecho-'+f.day+'.txt',data:'\ufeff'+f.txt}).then(()=>toast('Fecho guardado'),e=>{if(!e||e.code!=='declined')toast('Não foi possível guardar o ficheiro')});
      break;
    }
    case 'x_bkexport':bkPasswordSheet('export');break;
    case 'x_bkexportok':{
      const passphrase=$('#bk-pass').value,password2=$('#bk-pass2').value;
      if(Array.from(passphrase).length<8){bkError('A palavra-passe tem de ter pelo menos 8 caracteres.');break}
      if(passphrase!==password2){bkError('As palavras-passe não coincidem.');break}
      bkExport(passphrase);break;
    }
    case 'x_bkimport':case 'x_bkmergeimport':{xBk=null;xBkPending=null;const f=$('#bk-file');if(f)f.click();break}
    case 'x_bkdecrypt':{
      const passphrase=$('#bk-pass').value;
      if(Array.from(passphrase).length<8){bkError('A palavra-passe tem de ter pelo menos 8 caracteres.');break}
      bkDecrypt(passphrase);break;
    }
    case 'x_bkmerge':{
      try{bkMerge()}catch(e){toast(e&&e.message?e.message:'Não foi possível juntar a cópia.')}
      break;
    }
    case 'x_bkok':{
      if(!xBk)break;
      lsSet(LS+'-state',xBk.state);lsSet(LS+'-sales',xBk.sales);lsSet(LS+'-shifts',xBk.shifts);lsSet(LS+'-days',xBk.days);
      lsSet(SLS,normStk(xBk.stk));lsSet(SLS+'-movs',Array.isArray(xBk.smovs)?xBk.smovs:[]);
      xBk=null;
      location.reload();break;
    }
  }
}
function processCompanyLogoInput(input){
  if(!input.files||!input.files[0])return;
  companyLogoFromFile(input.files[0]).then(logo=>{
    state.company.logo=logo;save();render();toast('Logótipo atualizado');
  }).catch(e=>toast(e&&e.message?e.message:'Não foi possível carregar o logótipo.')).finally(()=>{input.value=''});
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='company-logo-file')processCompanyLogoInput(t);
  else if(t.id==='bk-file'&&t.files&&t.files[0]){
    const file=t.files[0];
    if(file.size>50*1024*1024){toast('A cópia excede o limite de 50 MB.');t.value='';return}
    file.text().then(txt=>{
      let o;
      try{o=JSON.parse(txt)}catch(e){throw new Error('O ficheiro não contém uma cópia válida.')}
      if(bkValidEnvelope(o)){xBk=null;xBkPending=o;bkPasswordSheet('import');return}
      if(o&&o.app==='costas-pos'){xBk=bkValidate(o);xBkPending=null;bkOfferRestore(false);return}
      throw new Error('Esse ficheiro não é uma cópia válida do POS.');
    }).catch(e=>toast(e&&e.message?e.message:'Não foi possível ler o ficheiro da cópia.'));
    t.value='';
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.i==='wanum'){state.wa=String(t.value).replace(/\D/g,'');save()}
  else if(t.dataset&&t.dataset.i==='company'&&Object.prototype.hasOwnProperty.call(state.company,t.dataset.key)){
    state.company[t.dataset.key]=String(t.value).slice(0,Number(t.maxLength)||100);save();
  }
});

restoreDeviceStorage().then(()=>{if(ui.user&&ui.view==='company')render()});
render();
window.scrollTo(0,0);
if(cloudRecovery.mode){markReady();renderLogin()}else attach();
})();
</script>

if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
