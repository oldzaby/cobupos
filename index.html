<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COBU ERP"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>COBU ERP</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tablet-first. Barra de topo fixa, depois mesas / pedido (produtos + talão de papel) / caixa / menu. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#191C20; --muted:#707782; --line:#E4E7EB;
  --accent:#D33529; --accent-ink:#FFFFFF; --mustard:#E3A23B;
  --accent-halo:rgba(211,53,41,.055); --accent-glow:#F0A14B; --hero-glow:#F3A04A;
  --occ-bg:#FBEBC4; --occ-ink:#4A3604; --ok:#2E7D4F; --warn:#9A5B00; --bad:#B3261E;
  --paper:#FFFDF6; --paper-ink:#1A1D1B; --paper-line:#C9C5B8; --bar:#1F6F8B;
  --late-bg:#FBE0DC;
  --k1-bg:#FBE4DC; --k1-bd:#E0836A; --k1-ink:#5A1F10;
  --k2-bg:#FBEFC8; --k2-bd:#D9A92B; --k2-ink:#4A3604;
  --k3-bg:#E0F0DB; --k3-bd:#6FAE5F; --k3-ink:#1E4A17;
  --k4-bg:#DAEFEF; --k4-bd:#4FA3A5; --k4-ink:#0F4547;
  --k5-bg:#DFE8F8; --k5-bd:#6C8FD4; --k5-ink:#172F5E;
  --k6-bg:#EBE2F6; --k6-bd:#9A78CC; --k6-ink:#3A2060;
  --free-bg:#E6F2E3; --free-bd:#8DBB84;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#1A1F25; --ink:#F2F4F7; --muted:#A3ABB5; --line:#2A3038;
    --accent:#F06455; --accent-ink:#FFFFFF; --mustard:#F0B44C;
    --occ-bg:#3A2E10; --occ-ink:#F6DFA0; --ok:#5DBB82; --warn:#E8B03A; --bad:#FF8A80;
    --paper:#ECE9DE; --paper-ink:#1A1D1B; --paper-line:#B9B5A8; --bar:#5FB0CF;
  --late-bg:#3F1D1A;
  --k1-bg:#3A2019; --k1-bd:#B5604A; --k1-ink:#F5C9BC;
  --k2-bg:#3A2F12; --k2-bd:#B38A1F; --k2-ink:#F6DFA0;
  --k3-bg:#1F3320; --k3-bd:#4E8A44; --k3-ink:#C9E7C1;
  --k4-bg:#17383A; --k4-bd:#3C8587; --k4-ink:#BFE6E7;
  --k5-bg:#1B2A45; --k5-bd:#4F72B8; --k5-ink:#C6D6F5;
  --k6-bg:#2B2140; --k6-bd:#7A5CAA; --k6-ink:#DACBF2;
  --free-bg:#1D2E21; --free-bd:#3F6B47;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1A1F25; --ink:#F2F4F7; --muted:#A3ABB5; --line:#2A3038;
  --accent:#F06455; --accent-ink:#FFFFFF; --mustard:#F0B44C;
  --occ-bg:#3A2E10; --occ-ink:#F6DFA0; --ok:#5DBB82; --warn:#E8B03A; --bad:#FF8A80;
  --paper:#ECE9DE; --paper-ink:#1A1D1B; --paper-line:#B9B5A8; --bar:#5FB0CF;
  --late-bg:#3F1D1A;
  --k1-bg:#3A2019; --k1-bd:#B5604A; --k1-ink:#F5C9BC;
  --k2-bg:#3A2F12; --k2-bd:#B38A1F; --k2-ink:#F6DFA0;
  --k3-bg:#1F3320; --k3-bd:#4E8A44; --k3-ink:#C9E7C1;
  --k4-bg:#17383A; --k4-bd:#3C8587; --k4-ink:#BFE6E7;
  --k5-bg:#1B2A45; --k5-bd:#4F72B8; --k5-ink:#C6D6F5;
  --k6-bg:#2B2140; --k6-bd:#7A5CAA; --k6-ink:#DACBF2;
  --free-bg:#1D2E21; --free-bd:#3F6B47;
  color-scheme:dark;
}
#chip-theme::before{background:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.themes button{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-weight:600;text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.themes i{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
[hidden]{display:none!important}
.k1{--kbg:var(--k1-bg);--kbd:var(--k1-bd);--kink:var(--k1-ink)}
.k2{--kbg:var(--k2-bg);--kbd:var(--k2-bd);--kink:var(--k2-ink)}
.k3{--kbg:var(--k3-bg);--kbd:var(--k3-bd);--kink:var(--k3-ink)}
.k4{--kbg:var(--k4-bg);--kbd:var(--k4-bd);--kink:var(--k4-ink)}
.k5{--kbg:var(--k5-bg);--kbd:var(--k5-bd);--kink:var(--k5-ink)}
.k6{--kbg:var(--k6-bg);--kbd:var(--k6-bd);--kink:var(--k6-ink)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:1180px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);opacity:.85}
.nav{color:var(--ink);max-width:100%;overflow-x:auto;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav button{white-space:nowrap;border:0;background:transparent;padding:9px 16px;border-radius:8px;font-weight:600;min-height:40px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok::before{background:var(--ok)} .chip.warn::before{background:var(--mustard)} .chip.bad::before{background:var(--bad)}
.chip.shift-open{background:var(--free-bg);border-color:var(--ok);color:var(--ok)}
.chip.shift-closed{background:var(--occ-bg);border-color:var(--mustard);color:var(--occ-ink)}
.chip.sync-state{font-size:13px;font-weight:700}
.chip.sync-state.ok{color:var(--ok)}
.chip.sync-state.warn{color:var(--warn)}
.chip.sync-state.bad{color:var(--bad)}
button.chip{cursor:pointer}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.view{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* mesas */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--occ-bg);color:var(--occ-ink);border:1px solid var(--mustard);border-radius:12px;padding:12px 16px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.tbl{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:116px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--free-bd);background:var(--free-bg);text-align:left}
.tbl .tn{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tbl .tn.w{font-size:20px;line-height:1.1}
.tbl .tl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl .tt{font-family:var(--f-mono);font-weight:600;font-size:14px}
.tbl .tm{font-size:12px;color:var(--muted)}
.tbl.occ{background:var(--occ-bg);color:var(--occ-ink);border:1.5px solid var(--mustard)}
.tbl.occ .tl,.tbl.occ .tm{color:var(--occ-ink);opacity:.8}
.tbl:hover{border-color:var(--ink)}

/* pedido */
.order{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cats button{white-space:nowrap;border:1.5px solid var(--kbd,var(--line));background:var(--kbg,var(--surface));color:var(--kink,var(--ink));border-radius:999px;padding:8px 16px;font-weight:600;min-height:40px}
.cats button[aria-pressed="true"]{background:var(--kink,var(--ink));color:var(--kbg,var(--bg));border-color:var(--kink,var(--ink))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px;padding:12px;border-radius:12px;border:1.5px solid var(--kbd,var(--line));background:var(--kbg,var(--surface));color:var(--kink,var(--ink));text-align:left}
.prod:hover{border-color:var(--accent)}
.prod:active{transform:scale(.98)}
.prod b{font-weight:600;line-height:1.2}
.prod span{font-family:var(--f-mono);font-size:14px;color:inherit;opacity:.8}
.prod-photo{display:block;width:100%;height:68px;object-fit:cover;border-radius:6px;border:1px solid rgba(32,43,53,.22)}
.badge{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;padding-inline:6px}

/* talão */
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 16px 16px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 30px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;font-family:var(--f-mono)}
.ticket hr{border:0;border-top:1.5px dashed var(--paper-line);margin:2px 0}
.t-head{text-align:center;display:flex;flex-direction:column;gap:2px}
.t-head b{font-family:var(--f-display);font-size:19px;font-weight:800}
.t-head small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.t-title{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.t-title span:last-child{font-size:12px;font-weight:400;opacity:.65}
.lines{display:flex;flex-direction:column;gap:8px;max-height:min(42vh,380px);overflow-y:auto}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.ln .nm{overflow-wrap:anywhere;line-height:1.25}
.ln .nm em{font-style:normal;font-size:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:4px;margin-left:6px;letter-spacing:.06em}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--paper-line);border-radius:8px}
.qty button{width:32px;height:32px;border:0;background:transparent;font-size:18px;line-height:1;border-radius:8px;color:var(--paper-ink)}
.qty button:hover{background:rgba(0,0,0,.07)}
.qty b{min-width:20px;text-align:center;font-weight:600}
.empty{text-align:center;padding:22px 6px;font-size:13px;opacity:.65;line-height:1.5}
.sum{display:flex;flex-direction:column;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-size:22px;font-weight:600;padding-top:4px}
.sum .iva{font-size:12px;opacity:.65}
.t-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.t-actions .btn{background:transparent;border-color:var(--paper-line);color:var(--paper-ink);font-family:var(--f-body);font-size:13px;padding:6px 8px;min-height:38px}
.t-actions .btn:hover{background:rgba(0,0,0,.06)}
.t-pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ticket .pay{font-family:var(--f-body);font-size:17px;min-height:52px}
.mbar{display:none}

/* caixa */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:flex;flex-direction:column;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.kv .big{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.kv .big b{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:17px}
.in.txt{font-family:var(--f-body);font-size:15px}
.diff{font-family:var(--f-mono);font-weight:600;font-size:18px}
.diff.ok{color:var(--ok)} .diff.bad{color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* menu */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow label.sw{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.menu-columns,.menu-row{display:grid;grid-template-columns:74px minmax(150px,1fr) 120px 110px auto;gap:10px;align-items:center}
.menu-columns{padding:8px 14px;background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.menu-row{grid-template-columns:74px minmax(150px,1fr) 120px 110px auto}
.menu-image-cell{display:flex;align-items:center;gap:5px;min-width:0}
.menu-image-preview{width:48px;height:42px;object-fit:cover;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.menu-image-empty{display:grid;place-items:center;width:48px;height:42px;border:1px dashed var(--line);border-radius:5px;color:var(--muted);font-size:10px}
.menu-image-cell .btn{min-width:32px;padding:4px 7px}
.mhead{padding:10px 14px;background:var(--kbg,var(--bg));font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--kink,var(--muted));font-weight:600;border-bottom:1px solid var(--line)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.sheet .big{font-family:var(--f-mono);font-size:30px;font-weight:600}
.sheet pre{margin:0;background:var(--paper);color:var(--paper-ink);padding:14px;border-radius:6px;font-family:var(--f-mono);font-size:12.5px;line-height:1.45;overflow-x:auto;white-space:pre}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.split-row{padding:10px 0;border-bottom:1px solid var(--line)}
.split-row:last-of-type{border-bottom:0}
.split-row .row{align-items:center}
.split-row select{min-width:0;max-width:62%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.split-row .field{margin-top:8px}
.note{font-size:13px;color:var(--warn);background:var(--occ-bg);border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}

/* cor da interface */
.tbl.occ.late{background:var(--late-bg);color:var(--ink);border:1.5px solid var(--bad)}
.tbl.occ.late .tl,.tbl.occ.late .tm{color:var(--ink)}
.tbl .tn.w{overflow-wrap:anywhere}
.dpill{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--bg)}
.tbl .dpill{display:block;width:max-content}
.hhbar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-size:14px}
.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-current="page"]::before{background:var(--bg)}
.cnt{min-width:84px;text-align:center;font-family:var(--f-mono);align-self:center}
.hhs{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hhs.off{opacity:.6}
.live{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ok);color:#fff}
.hhs .field{min-width:110px}
.rrow{grid-template-columns:minmax(0,1fr) 120px auto}
@media (max-width:860px){.rrow{grid-template-columns:minmax(0,1fr) 100px}.rrow .btn{justify-self:start}}
.tile.kk{background:var(--kbg);border-color:var(--kbd)}
.tile.kk b,.tile.kk small,.tile.kk span{color:var(--kink)}
.tile.kk small,.tile.kk span{opacity:.8}
.tr i.kc{background:var(--kbd)}
/* notas, despesas e relatórios */
.lnote{display:block;border:0;background:transparent;padding:3px 0 0;font-family:var(--f-body);font-size:12px;color:var(--paper-ink);opacity:.55;text-align:left;text-decoration:underline dotted;cursor:pointer}
.lnote.has{opacity:1;font-weight:600;text-decoration:none}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.xrow span{overflow-wrap:anywhere}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{min-width:150px;text-align:center;font-family:var(--f-display);font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero small,.tile.hero span{color:var(--accent-ink);opacity:.85}
.tile small{font-size:12px;color:var(--muted)}
.tile b{font-size:clamp(19px,5.4vw,26px);font-weight:700;line-height:1.1;white-space:nowrap}
.tile span{font-size:12px;color:var(--muted)}
.chart{position:relative;padding:20px 4px 0 46px}
.plot{position:relative;height:200px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gl.base{border-top-color:var(--muted)}
.gl span{position:absolute;left:-46px;top:-8px;width:40px;text-align:right;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:transparent;padding:0;min-width:0;cursor:default}
.col i{display:block;width:100%;max-width:24px;height:var(--h);background:var(--bar);border-radius:4px 4px 0 0}
.col:hover i,.col:focus-visible i{filter:brightness(1.2)}
.col .cv{position:absolute;bottom:calc(var(--h) + 4px);font-size:11px;font-family:var(--f-mono);font-weight:600;white-space:nowrap;color:var(--ink)}
.xl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;margin-top:6px}
.xl span{display:flex;justify-content:center;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.xl em{font-style:normal;white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:6px}
.hbr{display:grid;grid-template-columns:minmax(84px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;min-height:30px}
.hl{overflow-wrap:anywhere;line-height:1.2}
.hv{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr{display:block;height:14px;background:var(--line);border-radius:4px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
@media (max-width:560px){.hbr{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:4px 0}.hbr .tr{grid-column:1/-1;order:3}.mnav b{min-width:0}}
.det summary{cursor:pointer;font-weight:600;padding:8px 0}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.tip b{font-size:14px;font-family:var(--f-mono)}
.tip span{opacity:.75}
/* combos */
.cats .combo-btn,.combo-btn{white-space:nowrap;border:1.5px dashed var(--accent);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.cats .combo-btn:hover,.combo-btn:hover{background:var(--accent);color:var(--accent-ink);border-style:solid}
.ln .nm .cl{display:block;font-size:11.5px;opacity:.7;line-height:1.3;margin-top:2px;font-weight:400}
.clist{max-height:min(44vh,340px);overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cc{padding:8px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--kink,var(--muted));font-weight:600;background:var(--kbg,var(--surface));border-bottom:1px solid var(--line);position:sticky;top:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cn{min-width:0;overflow-wrap:anywhere;font-weight:600;line-height:1.25}
.cn small{display:block;font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:12.5px}
.cqty{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:none}
.cqty button{width:38px;height:38px;border:0;background:transparent;font-size:20px;line-height:1;border-radius:10px}
.cqty button:hover:not([disabled]){background:var(--line)}
.cqty button[disabled]{opacity:.3;cursor:not-allowed}
.cqty b{min-width:24px;text-align:center;font-family:var(--f-mono);font-weight:600}
.csum{display:flex;flex-direction:column;gap:6px}
.csum div{display:flex;justify-content:space-between;gap:12px}
.csum b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.csum .ctot{border-top:1px solid var(--line);padding-top:8px;font-size:19px}
.csum p{margin:0}
/* login */
.login{max-width:460px;margin:7vh auto 0;display:flex;flex-direction:column;gap:18px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.utile{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;min-height:68px;min-width:0}
.utile:hover{border-color:var(--accent)}
.utile b{display:block;overflow-wrap:anywhere}
.utile small{color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;background:var(--kink,var(--ink));color:var(--kbg,var(--bg));display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.dots{display:flex;gap:14px;justify-content:center;padding:8px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:24px;font-weight:600}
.pad button:active{background:var(--line)}
.err{color:var(--bad);font-weight:600;min-height:20px;font-size:14px}
.dots .err{min-height:0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
@media (max-width:860px){
  .nav{width:100%}
  .nav button{padding:9px 10px;flex:1}
  .order{grid-template-columns:minmax(0,1fr)}
  .ticket{position:static}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:8px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .mbar .m-total{display:flex;flex-direction:column;gap:0;flex:1;min-width:0;font-size:12px;line-height:1.2;color:var(--bg);opacity:.88}
  .mbar .m-total b{font-family:var(--f-mono);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--bg);opacity:1}
  .mbar .btn{min-height:44px;padding:8px 12px;white-space:nowrap}
  .mbar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .mbar .btn.m-ticket{background:transparent;border-color:rgba(255,255,255,.35);color:var(--bg)}
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .brand b{font-size:19px}
  .mrow{grid-template-columns:minmax(0,1fr) 110px}
  .mrow .sw,.mrow .btn{justify-self:start}
  .menu-columns{display:none}
  .menu-row{grid-template-columns:58px minmax(0,1fr) 100px;gap:8px}
  .menu-row .menu-image-cell{grid-row:span 2}
  .menu-row .sw{grid-column:2}
  .menu-row>.btn{grid-column:3;grid-row:2}
}
.company-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.company-logo-row{display:flex;align-items:center;gap:16px}
.company-logo-preview{width:96px;height:96px;flex:none;display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line);border-radius:18px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em}
.company-logo-preview img{width:100%;height:100%;object-fit:contain;padding:8px}
.company-logo-actions{display:flex;flex-direction:column;gap:12px;min-width:0}
#print-root{display:none}
@media(max-width:560px){.company-fields{grid-template-columns:minmax(0,1fr)}.company-logo-row{align-items:flex-start}}
.settings-grid{display:flex;flex-direction:column;gap:14px}
.corp-settings .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.corp-settings .settings-grid>.settings-company{grid-column:1/-1}
.settings-panel{min-width:0}
.settings-table{width:100%;border-collapse:collapse;min-width:0;table-layout:fixed}
.settings-table th,.settings-table td{white-space:normal}
.corp-settings .settings-table th,.corp-settings .settings-table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:normal;vertical-align:middle}
.corp-settings .settings-table th{width:30%;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted);text-align:left}
.corp-settings .settings-table tr:last-child th,.corp-settings .settings-table tr:last-child td{border-bottom:0}
.corp-settings .settings-table .in{min-height:40px;font-size:14px}
.corp-settings .settings-company .company-logo-preview{width:72px;height:64px;border-radius:8px}
.corp-settings .settings-company .company-logo-row{margin-bottom:14px}
.settings-storage{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.settings-room-head{display:none}
.corp-settings .settings-room-head{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;padding:8px 14px;background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lan-panel,.lan-pair{display:grid;gap:10px}
.lan-pair-code{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lan-pair-code small,.lan-addresses{color:var(--muted);font-size:12px}
.lan-pair-code strong{font-family:var(--f-mono);font-size:27px;letter-spacing:.18em;color:var(--accent)}
.lan-addresses{display:grid;gap:5px}
.lan-url{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere;color:var(--ink)}
@media(max-width:860px){.corp-settings .settings-grid{grid-template-columns:minmax(0,1fr)}.corp-settings .settings-grid>.settings-company{grid-column:auto}}
@media(max-width:860px) and (min-width:561px){.corp-settings .settings-room-head{grid-template-columns:minmax(0,1fr) 100px}.corp-settings .settings-room-head span:last-child{display:none}}
@media(max-width:560px){.corp-settings .settings-room-head{display:none}.corp-settings .settings-table th{width:36%;padding-left:4px;padding-right:6px}.corp-settings .settings-table td{padding-left:6px;padding-right:4px}.corp-settings .settings-company .company-logo-preview{width:64px;height:60px}}
@media print{
  @page{margin:12mm}
  html,body{width:auto!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important;color:#111!important}
  body>*{display:none!important}
  #print-root{display:block!important;position:static!important;inset:auto!important;width:auto!important;min-height:0!important;background:#fff!important;color:#111!important;font:10pt/1.4 Arial,Helvetica,sans-serif!important}
  #print-root .print-doc{max-width:760px;margin:0 auto}
  #print-root .print-doc.thermal{max-width:74mm;font-size:9pt}
  #print-root .print-head{text-align:center;border-bottom:1px solid #bbb;padding-bottom:10px;margin-bottom:12px}
  #print-root .print-logo{display:block;max-width:120px;max-height:72px;object-fit:contain;margin:0 auto 8px}
  #print-root .print-company{display:grid;gap:2px;color:#444;font-size:9pt}
  #print-root h1{font-size:17pt;margin:0 0 4px;letter-spacing:0}
  #print-root h2{font-size:13pt;margin:16px 0 6px;letter-spacing:0}
  #print-root .print-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:12px 0}
  #print-root table{width:100%;min-width:0;border-collapse:collapse}
  #print-root th,#print-root td{padding:5px 4px;border-bottom:1px solid #ddd;white-space:normal;text-align:left}
  #print-root th{background:#f1f1f1!important;color:#222}
  #print-root .print-number{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #print-root .print-totals{width:min(100%,340px);margin:12px 0 12px auto}
  #print-root .print-totals div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  #print-root .print-total{border-top:1px solid #777;margin-top:5px;padding-top:8px!important;font-weight:700;font-size:13pt}
  #print-root .print-note{margin-top:16px;padding-top:8px;border-top:1px solid #bbb;color:#555;font-size:8pt}
  #print-root .print-disclaimer{margin-top:10px;font-size:8pt;font-weight:600}
  #print-root .print-page-break{break-before:page}
}
@media (max-width:380px){
  .mbar{gap:5px;padding-left:8px;padding-right:8px}
  .mbar .btn{padding:8px 7px;font-size:13px}
}

/* estoque */
.lv{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(90px,2fr) minmax(110px,1fr);gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lvt{position:relative;display:block;height:10px;background:var(--line);border-radius:4px}
.lvt i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.lvt.warn i{background:var(--mustard)}
.lvt.bad i{background:var(--bad)}
.lvt b{position:absolute;top:-4px;bottom:-4px;left:33.3%;width:2px;background:var(--ink)}
.pl{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pl.ok{color:var(--ok)} .pl.warn{color:var(--warn)} .pl.bad{color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fsplit{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.fli{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 14px;min-height:44px}
.fli:last-child{border-bottom:0}
.fli[aria-current="true"]{background:var(--bg);box-shadow:inset 3px 0 var(--accent)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 96px 28px 44px;gap:8px;align-items:center}
.card h3+.sub{margin-top:-6px}
@media (max-width:860px){.fsplit{grid-template-columns:minmax(0,1fr)}.lv{grid-template-columns:minmax(0,1fr) auto}.lv .lvt{grid-column:1/-1;order:3}}
/* Visual refresh: a calm, glassy shell with warm restaurant accents. */
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 92% 0%,var(--accent-halo),transparent 30rem),
    var(--bg);
  letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.top{
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  color:var(--ink);
  border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);
  box-shadow:0 6px 24px rgba(22,28,36,.035);
  -webkit-backdrop-filter:saturate(170%) blur(20px);
  backdrop-filter:saturate(170%) blur(20px);
}
.top-in{gap:10px 20px}
.brand b{font-size:21px;letter-spacing:-.045em}
.brand i{color:var(--muted);font-size:10px;letter-spacing:.18em}
.nav{
  gap:3px;padding:4px;
  background:color-mix(in srgb,var(--bg) 82%,var(--surface));
  border-color:transparent;border-radius:14px;
}
.nav button{min-height:38px;padding:8px 14px;border-radius:10px;font-size:13px;transition:background .18s ease,color .18s ease}
.nav button[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 5px rgba(20,25,32,.1)}
.chip{min-height:34px;background:color-mix(in srgb,var(--surface) 80%,transparent);border-color:var(--line);font-size:11px}
.chips{gap:6px}
.btn{
  border-radius:12px;
  border-color:var(--line);
  box-shadow:0 1px 2px rgba(20,25,32,.035);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:hover:not([disabled]){border-color:color-mix(in srgb,var(--muted) 42%,var(--line));box-shadow:0 4px 12px rgba(20,25,32,.075)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 3px 9px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.04);box-shadow:0 5px 15px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
h1,h2,h3{letter-spacing:-.035em}
h2{font-size:28px}
h3{font-size:19px}
.view{gap:20px;padding-top:24px}
.stats{gap:26px}
.stats small{letter-spacing:.06em}
.tgrid{gap:14px}
.tbl{
  min-height:128px;padding:16px;border-radius:18px;border:1px solid var(--free-bd);
  background:linear-gradient(145deg,var(--surface),var(--free-bg));
  box-shadow:0 2px 6px rgba(20,25,32,.035);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.tbl .tn{font-size:36px;letter-spacing:-.045em}
.tbl .tl{letter-spacing:.08em}
.tbl.occ{border-color:color-mix(in srgb,var(--mustard) 70%,var(--line));background:linear-gradient(145deg,var(--occ-bg),color-mix(in srgb,var(--occ-bg) 65%,var(--surface)));box-shadow:0 3px 10px rgba(121,85,12,.07)}
.tbl.occ.late{border-color:var(--bad);background:var(--late-bg)}
.tbl:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 9px 22px rgba(20,25,32,.09)}
.banner,.hhbar{border-radius:16px}
.hhbar{background:linear-gradient(110deg,var(--accent),color-mix(in srgb,var(--accent) 78%,var(--accent-glow)));box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 16%,transparent)}
.order{gap:24px}
.pgrid{gap:12px}
.prod{
  min-height:104px;padding:16px;border-width:1px;border-radius:16px;
  box-shadow:0 2px 8px rgba(20,25,32,.035);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.prod:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 18px rgba(20,25,32,.085)}
.prod b{font-size:15px}
.cats{gap:8px}
.cats button{border-width:1px;padding:8px 15px}
.cats button[aria-pressed="true"]{box-shadow:0 3px 10px color-mix(in srgb,var(--kink,var(--accent)) 18%,transparent)}
.ticket{
  border:1px solid color-mix(in srgb,var(--paper-line) 60%,transparent);
  border-radius:18px;padding:20px;gap:12px;
  box-shadow:0 8px 28px rgba(20,25,32,.09),0 1px 3px rgba(20,25,32,.04);
}
.ticket hr{border-top-style:solid;border-color:color-mix(in srgb,var(--paper-line) 72%,transparent)}
.t-actions .btn{border-radius:10px}
.t-pay-actions .btn{border-radius:13px}
.card,.tile,.group,.tablewrap{
  border-radius:18px;
  border-color:var(--line);
  box-shadow:0 3px 12px rgba(20,25,32,.035);
}
.card{padding:20px;gap:14px}
.tile{padding:18px}
.tile.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 78%,var(--hero-glow)));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 17%,transparent)}
.in{
  border-radius:12px;background:var(--surface);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.in:focus{border-color:color-mix(in srgb,var(--accent) 72%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent);outline:0}
.seg button{border-radius:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 9px color-mix(in srgb,var(--accent) 18%,transparent)}
.tablewrap{overflow:hidden}
table{min-width:560px}
th{background:color-mix(in srgb,var(--bg) 68%,var(--surface));letter-spacing:.08em}
td,th{padding:12px 15px}
tr:not(:last-child) td{border-bottom-color:color-mix(in srgb,var(--line) 78%,transparent)}
.mhead{padding:12px 16px;letter-spacing:.1em}
.mrow{padding:12px 16px}
.scrim{background:rgba(12,16,22,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:22px;padding:24px;
  box-shadow:0 24px 80px rgba(12,16,22,.24);
}
.sheet .big{letter-spacing:-.05em}
.split-row{padding:12px 0}
.split-row select{border-radius:10px;min-height:42px}
.utile{border-radius:16px;box-shadow:0 2px 9px rgba(20,25,32,.04);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.utile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,25,32,.08)}
.av{width:44px;height:44px}
.login{margin:clamp(36px,8vh,84px) auto 0;gap:22px}
.login>div:first-child{text-align:center}
.login>div:first-child .sub{margin-top:8px!important}
.pad{gap:12px}
.pad button{border-radius:16px;box-shadow:0 2px 8px rgba(20,25,32,.04);transition:transform .16s ease,background .16s ease}
.pad button:active{transform:scale(.96)}
.toast{border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.2)}

function lanCanonical(value){
  if(Array.isArray(value))return value.map(lanCanonical);
  if(value&&typeof value==='object'){
    const result={};Object.keys(value).sort().forEach(key=>{result[key]=lanCanonical(value[key])});return result;
  }
  return value;
}
function lanEqual(a,b){return JSON.stringify(lanCanonical(a))===JSON.stringify(lanCanonical(b))}
function lanClone(value){return value===undefined?undefined:clone(value)}
function lanHeaders(json){
  const headers={};
  if(json)headers['Content-Type']='application/json';
  if(lan.token)headers.Authorization='Bearer '+lan.token;
  return headers;
}
async function lanRequest(path,options){
  const response=await fetch(path,Object.assign({headers:lanHeaders(false),cache:'no-store'},options||{}));
  let data=null;
  if(response.status!==204){const text=await response.text();if(text){try{data=JSON.parse(text)}catch(e){throw new Error('O servidor local devolveu uma resposta inválida.')}}}
  if(!response.ok)throw Object.assign(new Error(data&&data.error?data.error:'Falha na ligação ao servidor local.'),{status:response.status,data:data});

}

function lanChangedArray(base,local,remote,path,conflicts){
  const old=Array.isArray(base)?base:[],mine=Array.isArray(local)?local:[],theirs=Array.isArray(remote)?remote:[];
  if(!old.concat(mine,theirs).every(x=>x&&typeof x==='object'&&typeof x.id==='string')){
      if(lanEqual(local,base))return lanClone(remote);
      if(lanEqual(remote,base)||lanEqual(local,remote))return lanClone(local);
      conflicts.push(path);return lanClone(remote);
  }
  const b=new Map(old.map(x=>[x.id,x])),l=new Map(mine.map(x=>[x.id,x])),r=new Map(theirs.map(x=>[x.id,x]));
  const keys=new Set(Array.from(b.keys()).concat(Array.from(l.keys()),Array.from(r.keys())));
  const result=new Map(r);
  keys.forEach(id=>{
    const merged=lanMergeValue(b.get(id),l.get(id),r.get(id),path+'/'+id,conflicts);
    if(merged===undefined)result.delete(id);else if(merged!==lanNoChange)result.set(id,merged);
  });
  const ordered=theirs.map(x=>x.id);
  mine.forEach(x=>{if(ordered.indexOf(x.id)<0)ordered.push(x.id)});
  return ordered.filter(id=>result.has(id)).map(id=>result.get(id));
}
const lanNoChange={};
function lanMergeValue(base,local,remote,path,conflicts){
  if(lanEqual(local,base))return lanClone(remote);

  if(Array.isArray(local)||Array.isArray(remote)||Array.isArray(base))
    return lanChangedArray(base,local,remote,path,conflicts);
  const isObject=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(isObject(base)||isObject(local)||isObject(remote)){
    const b=isObject(base)?base:{},l=isObject(local)?local:{},r=isObject(remote)?remote:{};
    const result=Object.assign({},r);

async function lanPush(){

async function cloudFetch(path,options,authenticated,retry){

  request.headers=Object.assign({},cloudHeaders(false),options&&options.headers||{});

    await cloudRefresh();

  if(!response.ok){
    const message=data&&(data.msg||data.message||data.error_description||data.error);
    throw Object.assign(new Error(message||'Falha na ligação ao Supabase.'),{status:response.status,data:data});
  }

function lanNormalizePairingCode(value){
  const normalized=String(value||'').normalize?String(value||'').normalize('NFKC'):String(value||'');
  const digitStarts=[0x30,0x660,0x6f0,0x7c0,0x966,0x9e6,0xa66,0xae6,0xb66,0xbe6,0xc66,0xce6,0xd66,0xde6,0xe50,0xed0,0xf20,0x1040,0x1090,0x17e0,0x1810,0x1946,0x19d0,0x1a80,0x1a90,0x1b50,0x1bb0,0x1c40,0x1c50,0xa620,0xa8d0,0xa900,0xa9d0,0xa9f0,0xaa50,0xabf0,0x104a0,0x10d30,0x11066,0x110f0,0x11136,0x111d0,0x112f0,0x11450,0x114d0,0x11650,0x116c0,0x11730,0x118e0,0x11950,0x11c50,0x11d50,0x11da0,0x16a60,0x16ac0,0x16b50,0x1d7ce,0x1e140,0x1e2f0,0x1e4f0,0x1e950,0x1fbf0];
  let result='';
  for(const char of normalized){
    const cp=char.codePointAt(0);
    const start=digitStarts.find(value=>cp>=value&&cp<value+10);

  }
  return result;
}

  try{response=await fetch('/api/info',{cache:'no-store'});if(!response.ok)return false}
  catch(e){return false}
  const info=await response.json();
  if(!info||!info.server)return false;
  lan.available=true;lan.host=!!info.host;lan.code=info.pairingCode||'';lan.addresses=info.addresses||[];lan.port=Number(info.port)||18789;lan.devices=info.pairedDevices||0;
  if(lan.host){
    lan.active=true;
    const storedRev=Number(lsGet(LS+'-lan-rev',0))||0;
    lan.rev=storedRev;
    const result=await lanRequest('/api/sync?since=-1&device='+encodeURIComponent(DEVICE_ID));
    if(result.data&&result.data.exists){
      const remote=result.data.snapshot;
      if(lan.base){
        const merged=lanMergeSnapshots(lan.base,lanSnapshot(),remote);
        lanApplySnapshot(merged.snapshot,result.data.rev,result.data.snapshot);
        if(!lanEqual(merged.snapshot,remote))lanSchedulePush();
      }else lanApplySnapshot(remote,result.data.rev);
    }else if(!result.data||!result.data.exists){
      const initial=lanSnapshot();
      const created=await lanRequest('/api/sync',{method:'POST',headers:lanHeaders(true),body:JSON.stringify({rev:0,snapshot:initial})});
      lanPersistBase(initial,created.data.rev);setSync('lan');
    }
    lanStartPolling();markReady();return true;
  }
  if(lan.token){
    lan.active=true;lan.paired=true;
    lan.rev=Number(lsGet(LS+'-lan-rev',0))||0;
    try{
      const result=await lanRequest('/api/sync?since=-1&device='+encodeURIComponent(DEVICE_ID));
      if(result.data&&result.data.exists){
        if(lan.base){
          const merged=lanMergeSnapshots(lan.base,lanSnapshot(),result.data.snapshot);
          lanApplySnapshot(merged.snapshot,result.data.rev,result.data.snapshot);
          if(!lanEqual(merged.snapshot,result.data.snapshot))lanSchedulePush();
        }else lanApplySnapshot(result.data.snapshot,result.data.rev);
        lanStartPolling();
      }else if(!result.data||!result.data.exists)throw new Error('O servidor no PC ainda não foi inicializado.');
      markReady();return true;
    }catch(error){
      if(error.status===401){lan.token='';lsSet(LS+'-lan-token','');lan.active=false}
      else setSync('error');
    }
  }
  lan.active=false;markReady();render();return true;
}
async function lanPair(){
  const code=$('#lan-pair-code'),name=$('#lan-device-name'),err=$('#lan-pair-error');
  if(!code||!name)return;
  const pairingCode=lanNormalizePairingCode(code.value),deviceName=name.value.trim().slice(0,60);
  if(pairingCode.length!==8||!deviceName){if(err)err.textContent='Indica exatamente os 8 algarismos do código atual e o nome deste aparelho.';return}
  if(state.shift){if(err)err.textContent='Fecha o turno deste aparelho antes de o ligar à rede.';return}
  const hasLocalData=sales.length||shifts.length||days.length||smovs.length||state.users.length;
  if(!window.confirm('Ao ligar, as definições e utilizadores deste aparelho serão substituídos pelos do PC. Vendas, fechos e movimentos locais serão juntados. Continuar?'))return;
  if(err)err.textContent='A ligar ao servidor do PC…';
  try{
    const pair=await lanRequest('/api/pair',{method:'POST',headers:lanHeaders(true),body:JSON.stringify({code:pairingCode,deviceId:DEVICE_ID,deviceName:deviceName})});
    lan.token=pair.data.token;lan.deviceName=deviceName;lan.paired=true;lan.active=true;
    lsSet(LS+'-lan-token',lan.token);lsSet(LS+'-lan-name',deviceName);
    const result=await lanRequest('/api/sync?since=-1&device='+encodeURIComponent(DEVICE_ID));
    if(!result.data||!result.data.exists)throw new Error('Abre o COBU ERP no PC para preparar o servidor antes de ligar este aparelho.');
    const remote=result.data.snapshot,local=lanSnapshot();
    if(!remote.state.users||!remote.state.users.length||!remote.state.company||!remote.state.company.setupComplete)
      throw new Error('Conclui a criação do dono e a configuração da empresa no PC antes de ligar outros aparelhos.');
    if(hasLocalData){
      const merged=lanJoinExistingData(remote,local);
      lanApplySnapshot(merged.snapshot,result.data.rev,remote);
      if(merged.added)lanSchedulePush();
    }else lanApplySnapshot(remote,result.data.rev);
    lan.devices++;
    ui.user=null;ssSet(null);ui.login=freshLogin();lanStartPolling();render();
    toast('Aparelho ligado à rede local');
  }catch(error){
    lan.token='';lsSet(LS+'-lan-token','');lan.active=false;lan.paired=false;
    if(err)err.textContent=error.status===401?'Código recusado. Confirma o código atual em Definições no PC; ele muda quando o executável reinicia. Cola os 8 algarismos sem alterar os zeros iniciais.':error.message;
    setSync('error');
  }
}

function deviceDb(){
  if(!('indexedDB' in window))return Promise.reject(new Error('Armazenamento local avançado indisponível neste navegador.'));
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open('costas-pos-device',1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('handles'))request.result.createObjectStore('handles')};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('Não foi possível abrir o armazenamento local.'));
  });
}
async function storeDirectoryHandle(handle){
  const dbLocal=await deviceDb();
  await new Promise((resolve,reject)=>{
    const tx=dbLocal.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'documents');
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error||new Error('Não foi possível guardar a pasta escolhida.'));
    tx.onabort=()=>reject(tx.error||new Error('Não foi possível guardar a pasta escolhida.'));
  });
  dbLocal.close();
}
async function restoreDirectoryHandle(){
  if(!('indexedDB' in window))return null;
  const dbLocal=await deviceDb();
  const handle=await new Promise((resolve,reject)=>{
    const tx=dbLocal.transaction('handles','readonly'),request=tx.objectStore('handles').get('documents');
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error||new Error('Não foi possível ler a pasta guardada.'));
  });
  dbLocal.close();
  if(!handle)return null;
  try{
    if(await handle.queryPermission({mode:'readwrite'})==='granted')return handle;
  }catch(e){return null}
  return null;
}
async function chooseDocumentFolder(){
  if(typeof window.showDirectoryPicker!=='function')throw new Error('Este navegador não permite escolher uma pasta. Usa a opção de guardar ficheiro.');
  const handle=await window.showDirectoryPicker({id:'costas-pos-documents',mode:'readwrite'});
  const permission=await handle.requestPermission({mode:'readwrite'});
  if(permission!=='granted')throw new Error('Não foi dada autorização para escrever na pasta.');
  await storeDirectoryHandle(handle);
  documentFolder=handle;
  ui.storageStatus='Pasta de documentos: '+handle.name;
  render();
  toast('Pasta de documentos configurada');
}
async function persistDeviceStorage(){
  if(!navigator.storage||typeof navigator.storage.persist!=='function'){
    ui.storageStatus='Este navegador não permite pedir proteção contra limpeza automática.';
    render();return;
  }
  const persisted=await navigator.storage.persist();
  const estimate=typeof navigator.storage.estimate==='function'?await navigator.storage.estimate():null;
  const used=estimate&&Number.isFinite(estimate.usage)?' · '+(estimate.usage/1048576).toFixed(1)+' MB usados':'';
  ui.storageStatus=(persisted?'Armazenamento protegido contra limpeza automática':'O navegador não concedeu proteção; os dados continuam guardados neste aparelho')+used;
  render();
}
async function restoreDeviceStorage(){
  try{
    documentFolder=await restoreDirectoryHandle();
    if(documentFolder)ui.storageStatus='Pasta de documentos: '+documentFolder.name;
  }catch(e){ui.storageStatus=e&&e.message?e.message:'Não foi possível verificar o armazenamento local.'}
}
async function companyLogoFromFile(file){
  if(!file||!/^image\/(?:png|jpeg|webp)$/i.test(file.type))throw new Error('Escolhe um logótipo em PNG, JPG ou WebP.');
  if(file.size>8*1024*1024)throw new Error('A imagem excede o limite de 8 MB.');
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Não foi possível abrir esta imagem.'));image.src=url});
    const scale=Math.min(1,640/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const context=canvas.getContext('2d');if(!context)throw new Error('Não foi possível processar o logótipo.');
    context.drawImage(image,0,0,canvas.width,canvas.height);
    for(let i=0;i<5;i++){
      const quality=[.86,.76,.66,.58,.5][i],format=i<3?'image/webp':'image/jpeg';
      if(format==='image/jpeg'){context.globalCompositeOperation='destination-over';context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.globalCompositeOperation='source-over'}
      const data=canvas.toDataURL(format,quality);
      if(/^data:image\/(?:jpeg|webp);base64,/i.test(data)&&data.length<=120*1024)return data;
      if(i===2){canvas.width=Math.max(1,Math.round(canvas.width*.75));canvas.height=Math.max(1,Math.round(canvas.height*.75));context.drawImage(image,0,0,canvas.width,canvas.height)}
    }
    throw new Error('Não foi possível reduzir o logótipo o suficiente. Escolhe uma imagem mais pequena.');
  }finally{URL.revokeObjectURL(url)}
}
async function productImageFromFile(file){
  const type=String(file&&file.type||'').toLowerCase();
  if(!file||(type&&!['image/png','image/jpeg','image/jpg'].includes(type))||(!type&&!/\.(?:png|jpe?g)$/i.test(file.name||'')))throw new Error('Escolhe uma imagem JPG ou PNG.');
  if(file.size>8*1024*1024)throw new Error('A imagem excede o limite de 8 MB.');
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Não foi possível abrir esta imagem.'));image.src=url});
    if(!image.naturalWidth||!image.naturalHeight)throw new Error('A imagem não tem dimensões válidas.');
    let scale=Math.min(1,400/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas'),context=canvas.getContext('2d');
    if(!context)throw new Error('Não foi possível processar a imagem do produto.');
    let data='';
    for(let sizeAttempt=0;sizeAttempt<4;sizeAttempt++){
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      for(const quality of [.72,.62,.52,.42]){
        data=canvas.toDataURL('image/jpeg',quality);
        if(data.length<=40*1024)return data;
      }
      scale*=.75;
    }
    throw new Error('Não foi possível reduzir a imagem. Escolhe uma fotografia mais pequena.');
  }finally{URL.revokeObjectURL(url)}
}

const pend=()=>lsGet(LS+'-pending',[]);
function qPush(path,data){const q=pend().filter(x=>x.path!==path);q.push({path:path,data:data});lsSet(LS+'-pending',q)}
function qDone(path,data){lsSet(LS+'-pending',pend().filter(x=>!(x.path===path&&JSON.stringify(x.data)===JSON.stringify(data))))}
function qSend(x){
  if(!db)return;
  const r=db.doc(x.path);
  (x.data?r.set(x.data):r.delete()).then(()=>{qDone(x.path,x.data);setSync('cloud')}).catch(()=>setSync('error'));
}
function dbPut(path,data){if(lan.active){lanSchedulePush();return}if(cloud.active){cloudSchedulePush();return}if(STANDALONE)return;qPush(path,data);qSend({path:path,data:data})}
function qRetry(){pend().forEach(qSend)}
function mergePend(list,coll,key){
  const q=pend().filter(x=>x.path.indexOf(coll+'/')===0);
  if(!q.length)return list;
  const gone=q.filter(x=>!x.data).map(x=>x.path),add=q.filter(x=>x.data).map(x=>x.data);
  let out=list.filter(x=>gone.indexOf(coll+'/'+x.id)<0);
  add.forEach(a=>{if(!out.some(x=>x.id===a.id))out.push(a)});
  return out.sort((a,b)=>b.t-a.t);
}
function addDayClose(c){

function sha256Text(text){
  const k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[];for(let i=0;i<text.length;i++)bytes.push(text.charCodeAt(i));
  const bits=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  bytes.push(0,0,0,0,(bits>>>24)&255,(bits>>>16)&255,(bits>>>8)&255,bits&255);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let offset=0;offset<bytes.length;offset+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++){const j=offset+i*4;w[i]=((bytes[j]<<24)|(bytes[j+1]<<16)|(bytes[j+2]<<8)|bytes[j+3])>>>0}
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2],s0=rotr(a,7)^rotr(a,18)^(a>>>3),s1=rotr(b,17)^rotr(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],v=h[7];
    for(let i=0;i<64;i++){const s1=rotr(e,6)^rotr(e,11)^rotr(e,25),choice=(e&f)^(~e&g),t1=(v+s1+choice+k[i]+w[i])>>>0,s0=rotr(a,2)^rotr(a,13)^rotr(a,22),majority=(a&b)^(a&c)^(b&c),t2=(s0+majority)>>>0;v=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+v)>>>0;
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function hashPinLegacy(pin,salt){
  const text=salt+':'+pin;let x=5381;
  for(let i=0;i<text.length;i++)x=((x*33)^text.charCodeAt(i))>>>0;
  return 'f'+x.toString(16);
}
async function hashPin(pin,salt){
  const text=salt+':'+pin;
  try{
    const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return sha256Text(text)}
}

async function pinKey(k){
  const L=ui.login;
  if(Date.now()<L.lockUntil||L.busy)return;
  if(k==='x')L.pin=L.pin.slice(0,-1);else if(L.pin.length<4)L.pin+=k;
  L.err='';
  if(L.pin.length===4){
    const u=state.users.find(x=>x.id===L.id);if(!u)return;
    L.busy=true;
    const digest=await hashPin(L.pin,u.salt),legacy=hashPinLegacy(L.pin,u.salt);
    const ok=digest===u.pin||legacy===u.pin;
    L.busy=false;
    if(ok){if(u.pin===legacy&&u.pin!==digest){u.pin=digest;save()}enter(u);return}
    L.fails++;L.pin='';L.shake=true;
    if(L.fails>=5){L.lockUntil=Date.now()+30000;L.fails=0;L.err='Demasiadas tentativas. Espera 30 segundos.'}
    else L.err='PIN errado. Tenta outra vez.';
  }
  renderLogin();
}

function hashIdx(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%6}
function prodCat(name){const m=state.menu.find(x=>x.name===name);return m?kc(m.cat).slice(1):null}
function kc(cat){
  const s=String(cat).toLowerCase();
  return 'k'+(/hamb|burger/.test(s)?1:/hot/.test(s)?2:/tost|sandes/.test(s)?3:/acomp|batata|fritas/.test(s)?4:/beb|sumo|cerv|refri|água|agua/.test(s)?5:6);
}
const expTot=sh=>(sh.exp||[]).reduce((a,e)=>a+e.amount,0);
const NOTE_CHIPS=['Sem cebola','Sem queijo','Sem molho','Sem picles','Extra molho','Bem passado','Mal passado','Para levar'];
function mergeLines(o){
  const out=[];

    const t=out.find(x=>x.id===l.id&&!x.combo&&!l.combo&&(x.note||'')===(l.note||''));

/* ---------- relatórios ---------- */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function fmtK(n){
  if(n>=1e6)return String(Math.round(n/1e5)/10).replace('.',',')+'M';
  if(n>=1000)return String(Math.round(n/100)/10).replace('.',',')+'K';
  return String(Math.round(n));
}
function niceMax(max){
  if(max<=0)return {top:1,step:1};
  const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  return {top:Math.ceil(max/step-1e-9)*step,step:step};
}
function colChart(items){
  const max=Math.max.apply(null,items.map(i=>i.value)),nm=niceMax(max);
  let ticks='';
  for(let v=0;v<=nm.top+1e-9;v+=nm.step)ticks+=`<div class="gl${v===0?' base':''}" style="bottom:${v/nm.top*100}%"><span>${fmtK(v)}</span></div>`;
  const mi=max>0?items.findIndex(i=>i.value===max):-1;
  const cols=items.map((it,i)=>`<button class="col" data-tt="${esc(it.tt)}" data-tv="${esc(it.tv)}" style="--h:${it.value/nm.top*100}%" aria-label="${esc(it.tt+': '+it.tv)}">${i===mi?`<b class="cv">${fmtK(it.value)}</b>`:''}<i></i></button>`).join('');
  const xl=items.map(it=>`<span>${it.show?`<em>${esc(it.label)}</em>`:''}</span>`).join('');
  return `<div class="chart" style="--n:${items.length}"><div class="plot">${ticks}<div class="cols">${cols}</div></div><div class="xl">${xl}</div></div>`;
}
function hbars(rows){
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return '<div class="hb">'+rows.map(r=>`<div class="hbr"><span class="hl">${esc(r.label)}</span><span class="tr"><i${r.k!=null?' class="kc k'+r.k+'"':''} style="width:${r.value>0?Math.max(2,r.value/max*100):0}%"></i></span><span class="hv">${esc(r.right)}</span></div>`).join('')+'</div>';
}
function monthData(key){

const SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function repOf(day){const d=days.find(x=>x.day===day&&x.report);if(d)return d.report;const r=dayReport(day);return r.count?r:null}
function pctTxt(a,b){if(!(b>0))return '';const p=(a-b)/b*100;return (p>=0?'+':'−')+nfd(Math.abs(Math.round(p*10)/10))+'%'}
function monthCmp(key,md){
  const ym=key.split('-').map(Number),pk=new Date(ym[0],ym[1]-2,1),pkey=pk.getFullYear()+'-'+pad(pk.getMonth()+1);
  const today=dayOf(Date.now()),cur=today.slice(0,7)===key,lim=cur?+today.slice(8):99;
  const pd=monthData(pkey),pt=pd.list.filter(x=>+x.day.slice(8)<=lim).reduce((a,x)=>a+x.r.total,0);
  const ct=md.list.filter(x=>+x.day.slice(8)<=lim).reduce((a,x)=>a+x.r.total,0);
  const t=pctTxt(ct,pt);return t?t+(cur?' vs mesmo período do mês anterior':' vs mês anterior'):'';
}
function sumDays(n,off){
  const o={total:0,count:0,dias:0,prods:{},from:'',to:''};
  for(let i=off+n-1;i>=off;i--){
    const day=dayOf(Date.now()-i*86400000);if(!o.from)o.from=day;o.to=day;
    const r=repOf(day);if(!r)continue;
    o.total+=r.total;o.count+=r.count;o.dias++;
    (r.prods||r.top||[]).forEach(p=>{const q=o.prods[p.name]||(o.prods[p.name]={name:p.name,qty:0});q.qty+=p.qty});
  }
  o.top=Object.keys(o.prods).map(k=>o.prods[k]).sort((a,b)=>b.qty-a.qty).slice(0,5);
  return o;
}
const dm=d=>d.slice(8)+'/'+d.slice(5,7);

  const c=pctTxt(w.total,pw.total);if(c)o.push(line('Semana anterior',c));

function monthText(md,nome){

/* ---------- cálculo ---------- */
function autoDisc(o,sub){
  let best={amt:0,why:''};
  const tb=state.room.find(x=>x.id===o.tid);
  if(tb&&Number(tb.disc)>0)best={amt:Math.round(sub*tb.disc/100),why:(tb.name||'Lugar')+' '+fmtPct(tb.disc)+'%'};
  const h=activeHH();
  if(h){
    const cats=h.cats||[];
    const base=o.lines.reduce((a,l)=>{
      if(l.combo)return a;
      if(cats.length){const m=state.menu.find(x=>x.id===l.id);if(!m||cats.indexOf(m.cat)<0)return a}
      return a+l.price*l.qty;
    },0);
    const amt=Math.round(base*h.pct/100);
    if(amt>best.amt)best={amt:amt,why:(h.name||'Happy hour')+' '+fmtPct(h.pct)+'%'};
  }
  return best;
}
function calc(o){
  const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0);
  let disc,why='';
  if(o.disc){
    const d=o.disc;
    disc=d.type==='pct'?sub*(Number(d.v)||0)/100:(Number(d.v)||0);
  }else{const a=autoDisc(o,sub);disc=a.amt;why=a.why}
  disc=Math.max(0,Math.min(sub,Math.round(disc)));
  return {sub,disc,total:sub-disc,count:o.lines.reduce((a,l)=>a+l.qty,0),why:disc>0?why:''};
}

function sumShift(sid){
  const r={cash:0,tpa:0,transf:0,express:0,total:0,n:0};
  sales.filter(s=>s.shiftId===sid).forEach(s=>{salePayments(s).forEach(p=>{r[p.method]=(r[p.method]||0)+(Number(p.amount)||0)});r.total+=s.total;r.n++});

}

function updateSplitUI(){
  const o=state.orders[ui.table],btn=$('#confirmSplit');if(!o||!btn)return;

  let invalid=!state.shift;
  amounts.forEach((v,i)=>{

    if(recv<v)invalid=true;

  });

function receiptText(s){
  const W=34,line=(a,b)=>{a=String(a);b=String(b);return a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b};
  const c=state.company||{},o=[(c.name||"Costa's Burgers").toLocaleUpperCase('pt-PT'),c.nif?'NIF: '+c.nif:'',c.address||'',c.phone||'',c.email||'','Consulta de Mesa',dmy(s.t)+'  '+hhmm(s.t)+'  '+s.label,'Turno '+s.shiftN,'-'.repeat(W)].filter(Boolean);
  s.lines.forEach(l=>{o.push(line(l.qty+'x '+l.name,nf(l.qty*l.price)));if(l.items)l.items.forEach(i=>o.push(line('  '+i.qty+'x '+i.name,'')))});
  o.push('-'.repeat(W),line('Subtotal',nf(s.sub)));
  if(s.disc>0)o.push(line('Desconto'+(s.dwhy?' ('+s.dwhy+')':''),'-'+nf(s.disc)));
  o.push(line('TOTAL',kz(s.total)));
  if(Array.isArray(s.payments)){
    s.payments.forEach((p,i)=>{
      o.push(line('Pessoa '+(i+1)+' · '+METHODS[p.method],kz(p.amount)));
      if(p.method==='cash'){o.push(line('  Recebido',kz(p.received)),line('  Troco',kz(p.change)))}
    });
  }else{
    o.push(line(METHODS[s.method],kz(s.method==='cash'?s.received:s.total)));
    if(s.method==='cash')o.push(line('Troco',kz(s.change)));
  }
  o.push('IVA incluído ('+s.iva+'%): '+kz(ivaPart(s.total,s.iva)),'');
  if(c.receiptFooter)o.push(c.receiptFooter);
  o.push('Documento comercial informativo.','Não serve de Factura');
  return o.join('\n');
}

function printDocument(title,content,thermal,isReceipt){

async function savePrintFile(folder,name,content){
  if(!documentFolder){
    if(typeof window.showDirectoryPicker!=='function'){
      await saveFileLocal({filename:name,data:standalonePrintHtml(name.replace(/\.html$/i,''),content,folder==='Recibos',folder==='Recibos')});
      toast('Documento pronto para guardar');return;
    }
    const handle=await window.showDirectoryPicker({id:'costas-pos-documents',mode:'readwrite'});
    if(await handle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Não foi dada autorização para escrever na pasta.');
    await storeDirectoryHandle(handle);documentFolder=handle;
  }
  const dir=await documentFolder.getDirectoryHandle(folder,{create:true});
  const file=await dir.getFileHandle(name,{create:true});
  const writable=await file.createWritable();
  await writable.write(standalonePrintHtml(name.replace(/\.html$/i,''),content,folder==='Recibos',folder==='Recibos'));
  await writable.close();
  ui.storageStatus='Documento guardado em '+documentFolder.name+'\\'+folder+'\\'+name;
  render();
  toast('Documento guardado na pasta');
}

function dayReport(day,sourceSales,sourceShifts){
  const ss=(sourceSales||sales).filter(s=>dayOf(s.t)===day);
  const sh=(sourceShifts||shifts).filter(c=>c.day===day).slice().sort((a,b)=>a.n-b.n||a.t-b.t);
  const by={cash:0,tpa:0,transf:0,express:0},prod={},hours=new Array(24).fill(0);
  let total=0,disc=0,iva=0;
  ss.forEach(s=>{
    salePayments(s).forEach(p=>{by[p.method]=(by[p.method]||0)+(Number(p.amount)||0)});total+=s.total;disc+=s.disc||0;iva+=ivaPart(s.total,s.iva);hours[new Date(s.t).getHours()]+=s.total;
    s.lines.forEach(l=>{
      const add=(nm,qt,rv)=>{const p=prod[nm]||(prod[nm]={name:nm,qty:0,rev:0});p.qty+=qt;p.rev+=rv};
      if(l.items&&l.orig){const f=l.price/l.orig;l.items.forEach(it=>add(it.name,it.qty*l.qty,it.price*it.qty*l.qty*f))}
      else add(l.name,l.qty,l.qty*l.price);
    });
  });
  const top=Object.keys(prod).map(k=>prod[k]).sort((a,b)=>b.qty-a.qty).slice(0,5);
  const diff=sh.reduce((a,c)=>a+c.diff,0);
  return {day:day,count:ss.length,total:total,disc:disc,iva:Math.round(iva),by:by,shifts:sh.map(c=>({n:c.n,count:c.count,total:c.total,diff:c.diff,exp:c.exp||0})),top:top,diff:diff,exp:sh.reduce((a,c)=>a+(c.exp||0),0),prods:Object.keys(prod).map(k=>({name:prod[k].name,qty:prod[k].qty,rev:Math.round(prod[k].rev)})),hours:hours};
}
function dayText(r,when){
  const W=34,line=(a,b)=>{a=String(a);b=String(b);return a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b};
  const sg=n=>(n>0?'+':n<0?'-':'')+kz(Math.abs(n));
  const o=["COSTA'S BURGERS",'FECHO DO DIA · '+dmy(when),'-'.repeat(W)];
  if(!r.shifts.length)o.push('Sem turnos fechados');
  r.shifts.forEach(c=>{o.push(line('Turno '+c.n+' ('+c.count+' vendas)',kz(c.total)));o.push(line('  diferença de caixa',sg(c.diff)))});
  o.push('-'.repeat(W),line('Dinheiro',kz(r.by.cash)),line('TPA / Multicaixa',kz(r.by.tpa)),line('Transferência (TRF)',kz(r.by.transf)),line('Multicaixa Express',kz(r.by.express)),'-'.repeat(W),line('Vendas',r.count),line('Descontos','-'+kz(r.disc)),line('IVA incluído',kz(r.iva)),line('TOTAL DO DIA',kz(r.total)));
  if(r.exp)o.push(line('Despesas pagas da caixa','-'+kz(r.exp)));
  if(r.shifts.length)o.push(line('Diferença de caixa',sg(r.diff)));
  if(r.top.length){o.push('','Mais vendidos');r.top.forEach(p=>o.push(line(p.qty+'x '+p.name,kz(p.rev))))}
  return o.join('\n');
}

/* modelo: quantidade atual = contagem + compras − consumo das vendas − perdas */
function stModel(){
  const now=Date.now(),b=stk.base,res={ok:b.t>0,qty:{},ev:[],missing:{},avg:{},cut:false};
  if(!res.ok)return res;
  const byId={},byName={};
  state.menu.forEach(m=>{byId[m.id]=m;byName[String(m.name).toLowerCase()]=m});
  const addItem=(id,name,qt,t)=>{
    const m=(id&&byId[id])||byName[String(name).toLowerCase()],f=m&&stk.fichas[m.id];
    if(!f||!f.length){const k=m?m.name:name;res.missing[k]=(res.missing[k]||0)+qt;return}
    f.forEach(r=>res.ev.push({t:t,pid:r.pid,q:r.q*qt,k:'v'}));
  };
  const list=stSales();
  res.cut=!!list.cut;
  list.forEach(s=>{
    (s.lines||[]).forEach(l=>{
      if(l.items&&l.items.length)l.items.forEach(it=>addItem(it.id,it.name,it.qty*l.qty,s.t));
      else addItem(l.mid,l.name,l.qty,s.t);
    });
  });
  stk.produtos.forEach(p=>{res.qty[p.id]=Number(b.q[p.id])||0});
  smovs.forEach(m=>{
    if(m.t<=b.t||!(m.pid in res.qty))return;
    if(m.tipo==='entrada')res.qty[m.pid]+=m.qtd;
    else if(m.tipo==='saida')res.ev.push({t:m.t,pid:m.pid,q:m.qtd,k:'s'});
  });
  res.ev.forEach(e=>{if(e.pid in res.qty)res.qty[e.pid]-=e.q});
  const from=Math.max(b.t,now-7*DMS),span=Math.min(7,Math.max(1,(now-from)/DMS)),tot={};
  res.ev.forEach(e=>{if(e.t>=from)tot[e.pid]=(tot[e.pid]||0)+e.q});
  Object.keys(tot).forEach(k=>{res.avg[k]=tot[k]/span});
  return res;
}
function stStatus(p,M){
  const q=M.qty[p.id]||0,avg=M.avg[p.id]||0,dias=avg>0?q/avg:null;
  let lv='ok';
  if(q<=p.min)lv='bad';else if(dias!==null&&dias<=3)lv='warn';
  let sug=0;
  if(lv!=='ok'){const alvo=Math.max(avg*7,p.min*2),st=p.un==='un'?1:500;sug=Math.ceil(Math.max(0,alvo-q)/st)*st}
  return {q:q,avg:avg,dias:dias,lv:lv,sug:sug};
}
const stPill=s=>s.q<=0?'<span class="pl bad">Esgotado</span>':s.lv==='bad'?'<span class="pl bad">Abaixo do mínimo</span>':s.lv==='warn'?'<span class="pl warn">Acaba em breve</span>':'<span class="pl ok">Em dia</span>';
const stDias=s=>s.dias===null?'sem consumo':s.dias<1?'menos de 1 dia':nfd(Math.round(s.dias*10)/10)+' dias';
const stNet=m=>m.price-ivaPart(m.price,state.iva);
const stFichaCost=rows=>rows.reduce((a,r)=>{const p=stProd(r.pid);return a+(p?r.q*cpb(p):0)},0);

function stReport(M,per){
  const now=Date.now(),from=Math.max(per==='hoje'?sodT(now):sodT(now)-6*DMS,stk.base.t),rows={};
  stk.produtos.forEach(p=>{rows[p.id]={p:p,v:0,s:0}});
  M.ev.forEach(e=>{if(e.t>=from&&rows[e.pid])rows[e.pid][e.k]+=e.q});
  let rev=0,n=0;
  stSales().forEach(s=>{if(s.t<from)return;rev+=s.total-ivaPart(s.total,s.iva||0);n++});
  let cv=0,cs=0;
  Object.keys(rows).forEach(k=>{const r=rows[k],c=cpb(r.p);r.cv=r.v*c;r.cs=r.s*c;cv+=r.cv;cs+=r.cs});
  const list=Object.keys(rows).map(k=>rows[k]).filter(r=>r.v>0||r.s>0).sort((a,b)=>(b.cv+b.cs)-(a.cv+a.cs));
  return {from:from,rev:rev,n:n,cv:cv,cs:cs,list:list};
}

}

function stImport(txt){
  const d=JSON.parse(txt);
  if(!d||!Array.isArray(d.items))throw new Error('formato');
  const nm=s=>String(s||'').toLowerCase().replace(/\(exemplo\)/g,'').replace(/\s+/g,' ').trim();
  let newP=0,linked=0;const miss=[];
  d.items.forEach(f=>{
    if(!f||!Array.isArray(f.ing))return;
    const m=state.menu.find(x=>nm(x.name)===nm(f.n));
    if(!m){miss.push(String(f.n||'sem nome'));return}
    const y=Math.max(Number(f.y)||1,1),rows=[];
    f.ing.forEach(i=>{
      if(!i||!i.n)return;
      const u=['g','ml','un'].indexOf(i.u)>=0?i.u:'g';
      let p=stk.produtos.find(x=>nm(x.nome)===nm(i.n)&&x.un===u);
      if(!p){p={id:'p'+stNew(),nome:String(i.n).slice(0,40),cat:'outros',un:u,custo:Number(i.p)||0,min:0};stk.produtos.push(p);newP++}
      else if(!p.custo&&Number(i.p))p.custo=Number(i.p);
      const q=(Number(i.q)||0)/y;
      if(q>0)rows.push({pid:p.id,q:Math.round(q*1000)/1000});
    });
    if(rows.length){stk.fichas[m.id]=rows;linked++}
  });
  stSave();ui.st.fd=null;
  return {newP:newP,linked:linked,miss:miss};
}

const BK_ITERATIONS=310000,BK_FORMAT='costas-pos-encrypted-backup',BK_AAD='costas-pos-backup:v2';
let xBk=null,xBkPending=null;

}
function bkUnbase64(value){

}
async function bkKey(password,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:BK_ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function bkEncrypt(plain,password){

  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await bkKey(password,salt);
  const data=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:new TextEncoder().encode(BK_AAD)},key,new TextEncoder().encode(plain));
  return JSON.stringify({format:BK_FORMAT,v:2,kdf:'PBKDF2-SHA-256',iterations:BK_ITERATIONS,cipher:'AES-256-GCM',salt:bkBase64(salt),iv:bkBase64(iv),data:bkBase64(new Uint8Array(data))});
}
function bkValidEnvelope(o){
  if(!o||o.format!==BK_FORMAT||o.v!==2||o.kdf!=='PBKDF2-SHA-256'||o.iterations!==BK_ITERATIONS||o.cipher!=='AES-256-GCM'||typeof o.salt!=='string'||typeof o.iv!=='string'||typeof o.data!=='string')return false;
  try{return bkUnbase64(o.salt).length===16&&bkUnbase64(o.iv).length===12&&bkUnbase64(o.data).length>=16}catch(e){return false}
}
function bkValidate(o){
  const record=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(!record(o)||o.app!=='costas-pos'||o.v!==1||!Number.isFinite(o.t)||!record(o.state)||!Array.isArray(o.state.menu)||!Array.isArray(o.state.users)||!record(o.state.orders)||!Array.isArray(o.sales)||!Array.isArray(o.shifts)||!Array.isArray(o.days))throw new Error('A cópia não tem um formato válido.');
  if(o.deviceId!==undefined&&(typeof o.deviceId!=='string'||o.deviceId.length>80))throw new Error('A cópia tem um identificador de aparelho inválido.');
  if(!o.sales.every(x=>record(x)&&typeof x.id==='string'&&Number.isFinite(x.t)&&Array.isArray(x.lines))||!o.shifts.every(x=>record(x)&&typeof x.id==='string'&&Number.isFinite(x.t))||!o.days.every(x=>record(x)&&typeof x.day==='string'&&Number.isFinite(x.t)))throw new Error('A cópia contém registos inválidos.');
  if(!Object.keys(o.state.orders).every(k=>record(o.state.orders[k])&&Array.isArray(o.state.orders[k].lines)))throw new Error('A cópia contém pedidos inválidos.');
  if(!o.state.menu.every(record)||!o.state.users.every(record))throw new Error('A cópia contém definições inválidas.');
  if(o.stk!==undefined&&(!record(o.stk)||!Array.isArray(o.stk.produtos)||!record(o.stk.fichas)||!record(o.stk.base)))throw new Error('A cópia contém dados de estoque inválidos.');

}

function bkMergeRecords(current,incoming,prefix,remap){
  const out=current.map(x=>clone(x)),added=[],byId=new Map(),idMap=Object.create(null);
  out.forEach(x=>byId.set(x.id,x));
  incoming.forEach((source,index)=>{
    const item=clone(source),original=String(item.id||''),currentItem=byId.get(original);
    if(remap)remap(item);
    if(currentItem&&JSON.stringify(currentItem)===JSON.stringify(item)){if(idMap[original]===undefined)idMap[original]=original;return}
    if(currentItem){
      let candidate=original+'-import-'+prefix+'-'+index;
      const expected=clone(item);expected.id=candidate;
      const previouslyImported=byId.get(candidate);
      if(previouslyImported&&JSON.stringify(previouslyImported)===JSON.stringify(expected)){if(idMap[original]===undefined)idMap[original]=candidate;return}
      while(byId.has(candidate))candidate+='x';
      item.id=candidate;
    }else if(!original)item.id=prefix+'-'+index+'-'+DEVICE_ID;
    if(idMap[original]===undefined)idMap[original]=item.id;
    byId.set(item.id,item);out.push(item);added.push(item);
  });
  return {items:out,added:added,idMap:idMap};
}
function bkMerge(){
