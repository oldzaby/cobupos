<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C4301C">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Costa's POS"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Costa's Burgers POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tablet-first. Barra de topo fixa, depois mesas / pedido (produtos + talão de papel) / caixa / menu. */
:root{
  --bg:#EDEFEA; --surface:#FAFAF7; --ink:#1A1D1B; --muted:#5C655F; --line:#D2D7D0;
  --accent:#C4301C; --accent-ink:#FFFFFF; --mustard:#E2A21C;
  --occ-bg:#FBEBC4; --occ-ink:#4A3604; --ok:#2E7D4F; --warn:#9A5B00; --bad:#B3261E;
  --paper:#FFFDF6; --paper-ink:#1A1D1B; --paper-line:#C9C5B8; --bar:#1F6F8B;
  --late-bg:#FBE0DC;
  --k1-bg:#FBE4DC; --k1-bd:#E0836A; --k1-ink:#5A1F10;
  --k2-bg:#FBEFC8; --k2-bd:#D9A92B; --k2-ink:#4A3604;
  --k3-bg:#E0F0DB; --k3-bd:#6FAE5F; --k3-ink:#1E4A17;
  --k4-bg:#DAEFEF; --k4-bd:#4FA3A5; --k4-ink:#0F4547;
  --k5-bg:#DFE8F8; --k5-bd:#6C8FD4; --k5-ink:#172F5E;
  --k6-bg:#EBE2F6; --k6-bd:#9A78CC; --k6-ink:#3A2060;
  --free-bg:#E6F2E3; --free-bd:#8DBB84;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --surface:#1C201E; --ink:#ECEFEA; --muted:#9AA39D; --line:#2D3430;
    --accent:#D93D27; --accent-ink:#FFFFFF; --mustard:#E8B03A;
    --occ-bg:#3A2E10; --occ-ink:#F6DFA0; --ok:#5DBB82; --warn:#E8B03A; --bad:#FF8A80;
    --paper:#ECE9DE; --paper-ink:#1A1D1B; --paper-line:#B9B5A8; --bar:#5FB0CF;
  --late-bg:#3F1D1A;
  --k1-bg:#3A2019; --k1-bd:#B5604A; --k1-ink:#F5C9BC;
  --k2-bg:#3A2F12; --k2-bd:#B38A1F; --k2-ink:#F6DFA0;
  --k3-bg:#1F3320; --k3-bd:#4E8A44; --k3-ink:#C9E7C1;
  --k4-bg:#17383A; --k4-bd:#3C8587; --k4-ink:#BFE6E7;
  --k5-bg:#1B2A45; --k5-bd:#4F72B8; --k5-ink:#C6D6F5;
  --k6-bg:#2B2140; --k6-bd:#7A5CAA; --k6-ink:#DACBF2;
  --free-bg:#1D2E21; --free-bd:#3F6B47;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1C201E; --ink:#ECEFEA; --muted:#9AA39D; --line:#2D3430;
  --accent:#D93D27; --accent-ink:#FFFFFF; --mustard:#E8B03A;
  --occ-bg:#3A2E10; --occ-ink:#F6DFA0; --ok:#5DBB82; --warn:#E8B03A; --bad:#FF8A80;
  --paper:#ECE9DE; --paper-ink:#1A1D1B; --paper-line:#B9B5A8; --bar:#5FB0CF;
  --late-bg:#3F1D1A;
  --k1-bg:#3A2019; --k1-bd:#B5604A; --k1-ink:#F5C9BC;
  --k2-bg:#3A2F12; --k2-bd:#B38A1F; --k2-ink:#F6DFA0;
  --k3-bg:#1F3320; --k3-bd:#4E8A44; --k3-ink:#C9E7C1;
  --k4-bg:#17383A; --k4-bd:#3C8587; --k4-ink:#BFE6E7;
  --k5-bg:#1B2A45; --k5-bd:#4F72B8; --k5-ink:#C6D6F5;
  --k6-bg:#2B2140; --k6-bd:#7A5CAA; --k6-ink:#DACBF2;
  --free-bg:#1D2E21; --free-bd:#3F6B47;
  color-scheme:dark;
}
/* temas de cor: redefinem só o destaque, depois dos blocos claro/escuro */
:root[data-accent="brasa"]{--accent:#C2410C;--accent-ink:#FFFFFF}
:root[data-accent="mostarda"]{--accent:#E2A21C;--accent-ink:#1A1D1B}
:root[data-accent="folha"]{--accent:#1F7A4D;--accent-ink:#FFFFFF}
:root[data-accent="mare"]{--accent:#1D5FC4;--accent-ink:#FFFFFF}
:root[data-accent="uva"]{--accent:#6D3FC0;--accent-ink:#FFFFFF}
#chip-theme::before{background:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.themes button{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-weight:600;text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.themes i{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
[hidden]{display:none!important}
.k1{--kbg:var(--k1-bg);--kbd:var(--k1-bd);--kink:var(--k1-ink)}
.k2{--kbg:var(--k2-bg);--kbd:var(--k2-bd);--kink:var(--k2-ink)}
.k3{--kbg:var(--k3-bg);--kbd:var(--k3-bd);--kink:var(--k3-ink)}
.k4{--kbg:var(--k4-bg);--kbd:var(--k4-bd);--kink:var(--k4-ink)}
.k5{--kbg:var(--k5-bg);--kbd:var(--k5-bd);--kink:var(--k5-ink)}
.k6{--kbg:var(--k6-bg);--kbd:var(--k6-bd);--kink:var(--k6-ink)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:1180px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);opacity:.85}
.nav{color:var(--ink);max-width:100%;overflow-x:auto;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav button{white-space:nowrap;border:0;background:transparent;padding:9px 16px;border-radius:8px;font-weight:600;min-height:40px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok::before{background:var(--ok)} .chip.warn::before{background:var(--mustard)} .chip.bad::before{background:var(--bad)}
button.chip{cursor:pointer}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.view{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* mesas */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--occ-bg);color:var(--occ-ink);border:1px solid var(--mustard);border-radius:12px;padding:12px 16px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.tbl{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:116px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--free-bd);background:var(--free-bg);text-align:left}
.tbl .tn{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tbl .tn.w{font-size:20px;line-height:1.1}
.tbl .tl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl .tt{font-family:var(--f-mono);font-weight:600;font-size:14px}
.tbl .tm{font-size:12px;color:var(--muted)}
.tbl.occ{background:var(--occ-bg);color:var(--occ-ink);border:1.5px solid var(--mustard)}
.tbl.occ .tl,.tbl.occ .tm{color:var(--occ-ink);opacity:.8}
.tbl:hover{border-color:var(--ink)}

/* pedido */
.order{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cats button{white-space:nowrap;border:1.5px solid var(--kbd,var(--line));background:var(--kbg,var(--surface));color:var(--kink,var(--ink));border-radius:999px;padding:8px 16px;font-weight:600;min-height:40px}
.cats button[aria-pressed="true"]{background:var(--kink,var(--ink));color:var(--kbg,var(--bg));border-color:var(--kink,var(--ink))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px;padding:12px;border-radius:12px;border:1.5px solid var(--kbd,var(--line));background:var(--kbg,var(--surface));color:var(--kink,var(--ink));text-align:left}
.prod:hover{border-color:var(--accent)}
.prod:active{transform:scale(.98)}
.prod b{font-weight:600;line-height:1.2}
.prod span{font-family:var(--f-mono);font-size:14px;color:inherit;opacity:.8}
.badge{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;padding-inline:6px}

/* talão */
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 16px 16px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 30px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;font-family:var(--f-mono)}
.ticket hr{border:0;border-top:1.5px dashed var(--paper-line);margin:2px 0}
.t-head{text-align:center;display:flex;flex-direction:column;gap:2px}
.t-head b{font-family:var(--f-display);font-size:19px;font-weight:800}
.t-head small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.t-title{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.t-title span:last-child{font-size:12px;font-weight:400;opacity:.65}
.lines{display:flex;flex-direction:column;gap:8px;max-height:min(42vh,380px);overflow-y:auto}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.ln .nm{overflow-wrap:anywhere;line-height:1.25}
.ln .nm em{font-style:normal;font-size:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:4px;margin-left:6px;letter-spacing:.06em}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--paper-line);border-radius:8px}
.qty button{width:32px;height:32px;border:0;background:transparent;font-size:18px;line-height:1;border-radius:8px;color:var(--paper-ink)}
.qty button:hover{background:rgba(0,0,0,.07)}
.qty b{min-width:20px;text-align:center;font-weight:600}
.empty{text-align:center;padding:22px 6px;font-size:13px;opacity:.65;line-height:1.5}
.sum{display:flex;flex-direction:column;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-size:22px;font-weight:600;padding-top:4px}
.sum .iva{font-size:12px;opacity:.65}
.t-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.t-actions .btn{background:transparent;border-color:var(--paper-line);color:var(--paper-ink);font-family:var(--f-body);font-size:13px;padding:6px 8px;min-height:38px}
.t-actions .btn:hover{background:rgba(0,0,0,.06)}
.ticket .pay{font-family:var(--f-body);font-size:17px;min-height:52px}
.mbar{display:none}

/* caixa */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:flex;flex-direction:column;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.kv .big{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.kv .big b{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:17px}
.in.txt{font-family:var(--f-body);font-size:15px}
.diff{font-family:var(--f-mono);font-weight:600;font-size:18px}
.diff.ok{color:var(--ok)} .diff.bad{color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* menu */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow label.sw{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.mhead{padding:10px 14px;background:var(--kbg,var(--bg));font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--kink,var(--muted));font-weight:600;border-bottom:1px solid var(--line)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.sheet .big{font-family:var(--f-mono);font-size:30px;font-weight:600}
.sheet pre{margin:0;background:var(--paper);color:var(--paper-ink);padding:14px;border-radius:6px;font-family:var(--f-mono);font-size:12.5px;line-height:1.45;overflow-x:auto;white-space:pre}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.note{font-size:13px;color:var(--warn);background:var(--occ-bg);border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}

/* cor da interface */
.tbl.occ.late{background:var(--late-bg);color:var(--ink);border:1.5px solid var(--bad)}
.tbl.occ.late .tl,.tbl.occ.late .tm{color:var(--ink)}
.tbl .tn.w{overflow-wrap:anywhere}
.dpill{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--bg)}
.tbl .dpill{display:block;width:max-content}
.hhbar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-size:14px}
.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-current="page"]::before{background:var(--bg)}
.cnt{min-width:84px;text-align:center;font-family:var(--f-mono);align-self:center}
.hhs{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hhs.off{opacity:.6}
.live{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ok);color:#fff}
.hhs .field{min-width:110px}
.rrow{grid-template-columns:minmax(0,1fr) 120px auto}
@media (max-width:860px){.rrow{grid-template-columns:minmax(0,1fr) 100px}.rrow .btn{justify-self:start}}
.tile.kk{background:var(--kbg);border-color:var(--kbd)}
.tile.kk b,.tile.kk small,.tile.kk span{color:var(--kink)}
.tile.kk small,.tile.kk span{opacity:.8}
.tr i.kc{background:var(--kbd)}
/* notas, despesas e relatórios */
.lnote{display:block;border:0;background:transparent;padding:3px 0 0;font-family:var(--f-body);font-size:12px;color:var(--paper-ink);opacity:.55;text-align:left;text-decoration:underline dotted;cursor:pointer}
.lnote.has{opacity:1;font-weight:600;text-decoration:none}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.xrow span{overflow-wrap:anywhere}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{min-width:150px;text-align:center;font-family:var(--f-display);font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}

(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const kz=n=>nf(n)+' Kz';
const pad=n=>String(n).padStart(2,'0');
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dmy=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const dayOf=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const clone=o=>JSON.parse(JSON.stringify(o));

function defaultRoom(){
  const r=[];for(let i=1;i<=10;i++)r.push({id:'M'+i,name:'Mesa '+i,kind:'t',disc:0});
  r.push({id:'BALCAO',name:'Balcão',kind:'w',disc:0},{id:'LEVAR',name:'Para levar',kind:'w',disc:0});

const tlabel=t=>{const r=state.room.find(x=>x.id===t);return r?(r.name||'Sem nome'):t==='BALCAO'?'Balcão':t==='LEVAR'?'Para levar':'Mesa '+String(t).slice(1)};
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const toMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?Math.min(1439,(+m[1])*60+(+m[2])):0};
function hhOn(h,now){
  const d=new Date(now),mn=d.getHours()*60+d.getMinutes(),dy=d.getDay(),a=toMin(h.start),b=toMin(h.end),days=h.days||[];
  if(a<b)return days.indexOf(dy)>=0&&mn>=a&&mn<b;
  return (days.indexOf(dy)>=0&&mn>=a)||(days.indexOf((dy+6)%7)>=0&&mn<b);
}

}

const DEFAULT_MENU=[
 {id:'m1',name:'Hambúrguer simples',cat:'Hambúrgueres',price:3500,on:true},
 {id:'m2',name:'Cheeseburger',cat:'Hambúrgueres',price:4000,on:true},

 {id:'m6',name:'Hot dog completo',cat:'Hot dogs',price:3500,on:true},
 {id:'m7',name:'Tosta mista',cat:'Tostas',price:2000,on:true},
 {id:'m8',name:'Tosta de frango',cat:'Tostas',price:2800,on:true},
 {id:'m9',name:'Batata frita',cat:'Acompanhamentos',price:1500,on:true},
 {id:'m10',name:'Batata frita grande',cat:'Acompanhamentos',price:2500,on:true},
 {id:'m11',name:'Água',cat:'Bebidas',price:500,on:true},
 {id:'m12',name:'Refrigerante',cat:'Bebidas',price:800,on:true},
 {id:'m13',name:'Sumo natural',cat:'Bebidas',price:1500,on:true},

];
const LS='costas-pos-v1';
const STANDALONE=!(window.claude&&window.claude.use);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){lsFull()}};
function norm(s){
  s=s&&typeof s==='object'?s:{};
  if(!Array.isArray(s.menu)||!s.menu.length) s.menu=clone(DEFAULT_MENU);
  if(typeof s.iva!=='number') s.iva=14;
  if(typeof s.comboDisc!=='number') s.comboDisc=4.5;
  if(!s.orders||typeof s.orders!=='object') s.orders={};

  if(!Array.isArray(s.room)||!s.room.length) s.room=defaultRoom();
  if(!Array.isArray(s.hh)) s.hh=[];
  Object.keys(s.orders).forEach(k=>{s.orders[k].tid=k});
  return s;
}
let state=norm(lsGet(LS+'-state',null));
let sales=lsGet(LS+'-sales',[]);
let days=lsGet(LS+'-days',[]);
let shifts=lsGet(LS+'-shifts',[]);
const ui={view:'tables',table:null,cat:null,sheet:null,pay:{method:'cash',received:''},disc:{type:'pct',v:''},counted:'',sync:'local'};
ui.user=null;ui.ready=false;ui.login=freshLogin();
let db=null,dl=STANDALONE?{save:saveFileLocal}:null,rev=0,dirty=false,saving=false,saveTimer=null;

/* ---------- armazenamento ---------- */
function setSync(s){ui.sync=s;paintChips()}
function save(){
  lsSet(LS+'-state',state);
  if(!db)return;
  rev++;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,300);
}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,200);return}
  saving=true;const r=rev;
  try{await db.doc('pos/state').set(clone(state));if(r===rev)dirty=false;setSync('cloud')}
  catch(e){setSync('error')}
  saving=false;
}
function persistLists(){lsSet(LS+'-sales',sales.slice(0,3000));lsSet(LS+'-shifts',shifts.slice(0,400));lsSet(LS+'-days',days.slice(0,400))}
/* fila de reenvio: o que não chegou à conta fica guardado e volta a ser enviado */
const pend=()=>lsGet(LS+'-pending',[]);
function qPush(path,data){const q=pend().filter(x=>x.path!==path);q.push({path:path,data:data});lsSet(LS+'-pending',q)}
function qDone(path,data){lsSet(LS+'-pending',pend().filter(x=>!(x.path===path&&JSON.stringify(x.data)===JSON.stringify(data))))}
function qSend(x){
  if(!db)return;
  const r=db.doc(x.path);
  (x.data?r.set(x.data):r.delete()).then(()=>{qDone(x.path,x.data);setSync('cloud')}).catch(()=>setSync('error'));
}
function dbPut(path,data){if(STANDALONE)return;qPush(path,data);qSend({path:path,data:data})}
function qRetry(){pend().forEach(qSend)}
function mergePend(list,coll,key){
  const q=pend().filter(x=>x.path.indexOf(coll+'/')===0);
  if(!q.length)return list;
  const gone=q.filter(x=>!x.data).map(x=>x.path),add=q.filter(x=>x.data).map(x=>x.data);
  let out=list.filter(x=>gone.indexOf(coll+'/'+x.id)<0);
  add.forEach(a=>{if(!out.some(x=>x.id===a.id))out.push(a)});
  return out.sort((a,b)=>b.t-a.t);
}
function addDayClose(c){
  days=days.filter(x=>x.day!==c.day);days.unshift(c);persistLists();
  dbPut('days/'+c.id,c);
}
function removeDayClose(day){
  days=days.filter(x=>x.day!==day);persistLists();
  dbPut('days/d'+day,null);
}
function addSale(s){
  sales.unshift(s);persistLists();
  dbPut('sales/'+s.id,s);
}
function addShiftClose(c){
  shifts.unshift(c);persistLists();
  dbPut('shifts/'+c.id,c);
}
async function attach(){
  try{
    const c=window.claude;
    if(!c||!c.use){markReady();return}
    db=await c.use('db');
    dl=await c.use('downloads');
    if(!db){markReady();return}
    setSync('loading');qRetry();
    db.collection('days').orderBy('t','desc').limit(200).onSnapshot(q=>{
      days=mergePend(q.docs.map(d=>clone(d.data())),'days');persistLists();if(ui.view==='cash'&&!ui.sheet)render();
    },()=>setSync('error'));
    db.doc('pos/state').onSnapshot(s=>{
      if(dirty||saving)return;
      if(s.exists){state=norm(clone(s.data()));lsSet(LS+'-state',state)}
      if(ui.ready)render();else markReady();
      setSync('cloud');
    },()=>setSync('error'));
    db.collection('sales').orderBy('t','desc').limit(800).onSnapshot(q=>{
      sales=mergePend(q.docs.map(d=>clone(d.data())),'sales');persistLists();if(ui.view==='cash'&&!ui.sheet)render();
    },()=>setSync('error'));
    db.collection('shifts').orderBy('t','desc').limit(200).onSnapshot(q=>{
      shifts=mergePend(q.docs.map(d=>clone(d.data())),'shifts');persistLists();if(ui.view==='cash'&&!ui.sheet)render();
    },()=>setSync('error'));
    db.doc('stock/state').onSnapshot(s=>{
      if(pend().some(x=>x.path==='stock/state'))return;
      if(s.exists){stk=normStk(clone(s.data()));lsSet(SLS,stk)}
      stSubSales();stRender();
    },()=>{});

      smovs=mergePend(q.docs.map(d=>clone(d.data())),'stockmovs');lsSet(SLS+'-movs',smovs.slice(0,500));stRender();
    },()=>{});
    stSubSales();
  }catch(e){db=null;setSync('local');markReady()}
}

const ROLES={dono:['tables','cash','report','stock','menu','team','settings'],gerente:['tables','cash','report','stock'],empregado:['tables']};
const ROLE_NAME={dono:'Dono',gerente:'Gerente',empregado:'Empregado'};
const canGo=v=>(ROLES[ui.user&&ui.user.role]||[]).indexOf(v)>=0;
let idleT=null;
function freshLogin(){return {id:null,pin:'',err:'',fails:0,lockUntil:0,shake:false,busy:false}}
function ssGet(){try{return sessionStorage.getItem(LS+'-user')}catch(e){return null}}
function ssSet(v){try{if(v)sessionStorage.setItem(LS+'-user',v);else sessionStorage.removeItem(LS+'-user')}catch(e){}}
async function hashPin(pin,salt){
  const s=salt+':'+pin;
  try{
    const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let x=5381;for(let i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;
    return 'f'+x.toString(16);
  }
}
const newSalt=()=>Math.random().toString(36).slice(2,10);
function markReady(){if(!ui.ready){ui.ready=true;render()}}
function bump(){clearTimeout(idleT);if(ui.user)idleT=setTimeout(lock,5*60*1000)}
function lock(){ui.user=null;ssSet(null);ui.view='tables';ui.table=null;ui.login=freshLogin();clearTimeout(idleT);closeSheet();render()}
function enter(u){ui.user=u;ssSet(u.id);ui.view='tables';ui.table=null;ui.login=freshLogin();bump();render();window.scrollTo(0,0);toast('Olá, '+u.name)}
async function pinKey(k){
  const L=ui.login;
  if(Date.now()<L.lockUntil||L.busy)return;
  if(k==='x')L.pin=L.pin.slice(0,-1);else if(L.pin.length<4)L.pin+=k;
  L.err='';
  if(L.pin.length===4){
    const u=state.users.find(x=>x.id===L.id);if(!u)return;
    L.busy=true;
    const ok=(await hashPin(L.pin,u.salt))===u.pin;
    L.busy=false;
    if(ok){enter(u);return}
    L.fails++;L.pin='';L.shake=true;
    if(L.fails>=5){L.lockUntil=Date.now()+30000;L.fails=0;L.err='Demasiadas tentativas. Espera 30 segundos.'}
    else L.err='PIN errado. Tenta outra vez.';
  }
  renderLogin();

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function fmtK(n){
  if(n>=1e6)return String(Math.round(n/1e5)/10).replace('.',',')+'M';
  if(n>=1000)return String(Math.round(n/100)/10).replace('.',',')+'K';
  return String(Math.round(n));
}
function niceMax(max){
  if(max<=0)return {top:1,step:1};
  const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  return {top:Math.ceil(max/step-1e-9)*step,step:step};
}
function colChart(items){
  const max=Math.max.apply(null,items.map(i=>i.value)),nm=niceMax(max);
  let ticks='';
  for(let v=0;v<=nm.top+1e-9;v+=nm.step)ticks+=`<div class="gl${v===0?' base':''}" style="bottom:${v/nm.top*100}%"><span>${fmtK(v)}</span></div>`;
  const mi=max>0?items.findIndex(i=>i.value===max):-1;
  const cols=items.map((it,i)=>`<button class="col" data-tt="${esc(it.tt)}" data-tv="${esc(it.tv)}" style="--h:${it.value/nm.top*100}%" aria-label="${esc(it.tt+': '+it.tv)}">${i===mi?`<b class="cv">${fmtK(it.value)}</b>`:''}<i></i></button>`).join('');
  const xl=items.map(it=>`<span>${it.show?`<em>${esc(it.label)}</em>`:''}</span>`).join('');
  return `<div class="chart" style="--n:${items.length}"><div class="plot">${ticks}<div class="cols">${cols}</div></div><div class="xl">${xl}</div></div>`;
}
function hbars(rows){
  const max=Math.max.apply(null,rows.map(r=>r.value))||1;
  return '<div class="hb">'+rows.map(r=>`<div class="hbr"><span class="hl">${esc(r.label)}</span><span class="tr"><i${r.k!=null?' class="kc k'+r.k+'"':''} style="width:${r.value>0?Math.max(2,r.value/max*100):0}%"></i></span><span class="hv">${esc(r.right)}</span></div>`).join('')+'</div>';
}
function monthData(key){
  const today=dayOf(Date.now());
  const list=days.filter(d=>d.report&&d.day.slice(0,7)===key).map(d=>({day:d.day,r:d.report,live:false}));
  if(today.slice(0,7)===key&&!days.some(d=>d.day===today)){const r=dayReport(today);if(r.count)list.push({day:today,r:r,live:true})}
  list.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
  const m={list:list,total:0,count:0,disc:0,iva:0,exp:0,by:{cash:0,tpa:0,transf:0},hours:new Array(24).fill(0),prods:{}};
  list.forEach(x=>{
    const r=x.r;m.total+=r.total;m.count+=r.count;m.disc+=r.disc||0;m.iva+=r.iva||0;m.exp+=r.exp||0;
    ['cash','tpa','transf'].forEach(k=>{m.by[k]+=(r.by&&r.by[k])||0});
    (r.hours||[]).forEach((v,i)=>{m.hours[i]+=v});
    (r.prods||r.top||[]).forEach(p=>{const q=m.prods[p.name]||(m.prods[p.name]={name:p.name,qty:0,rev:0});q.qty+=p.qty;q.rev+=p.rev});

}

/* ---------- cálculo ---------- */
function autoDisc(o,sub){
  let best={amt:0,why:''};
  const tb=state.room.find(x=>x.id===o.tid);
  if(tb&&Number(tb.disc)>0)best={amt:Math.round(sub*tb.disc/100),why:(tb.name||'Lugar')+' '+fmtPct(tb.disc)+'%'};
  const h=activeHH();
  if(h){
    const cats=h.cats||[];
    const base=o.lines.reduce((a,l)=>{
      if(l.combo)return a;
      if(cats.length){const m=state.menu.find(x=>x.id===l.id);if(!m||cats.indexOf(m.cat)<0)return a}
      return a+l.price*l.qty;
    },0);
    const amt=Math.round(base*h.pct/100);
    if(amt>best.amt)best={amt:amt,why:(h.name||'Happy hour')+' '+fmtPct(h.pct)+'%'};
  }
  return best;
}
function calc(o){
  const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0);
  let disc,why='';
  if(o.disc){
    const d=o.disc;
    disc=d.type==='pct'?sub*(Number(d.v)||0)/100:(Number(d.v)||0);
  }else{const a=autoDisc(o,sub);disc=a.amt;why=a.why}
  disc=Math.max(0,Math.min(sub,Math.round(disc)));
  return {sub,disc,total:sub-disc,count:o.lines.reduce((a,l)=>a+l.qty,0),why:disc>0?why:''};
}

  return 'COZINHA · '+tlabel(t)+' · '+hhmm(Date.now())+'\n'+'-'.repeat(28)+'\n'+lines.map(l=>(l.qty-l.sent)+'x '+l.name+(l.combo?'\n'+l.items.map(i=>'   - '+i.qty+'x '+i.name).join('\n'):'')+(l.note?'\n   >> '+l.note:'')).join('\n');
}

  const t=ui.table,o=state.orders[t];if(!o)return;

function sheetPay(){
  const o=state.orders[ui.table];if(!o||!o.lines.length)return;
  const c=calc(o);
  const r=(x,u)=>Math.ceil(x/u)*u;
  const q=[c.total,r(c.total,1000),r(c.total,5000),r(c.total,10000),r(c.total,20000)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
  openSheet(`<h3>Pagar · ${esc(tlabel(ui.table))}</h3><div class="big">${kz(c.total)}</div>
  <div class="seg">${Object.keys(METHODS).map(k=>`<button data-a="paym" data-m="${k}" aria-pressed="${ui.pay.method===k}">${METHODS[k]}</button>`).join('')}</div>
  <div id="cashbox" ${ui.pay.method==='cash'?'':'hidden'}><div class="field"><label for="recv">Valor recebido (Kz)</label><input class="in" id="recv" data-i="recv" inputmode="numeric" value="${esc(ui.pay.received)}"></div>
  <div class="seg" style="margin-top:8px">${q.map(v=>`<button class="btn sm" data-a="recvq" data-v="${v}">${v===c.total?'Exato':nf(v)}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><span class="sub">Troco</span><span class="diff" id="troco"></span></div></div>
  ${state.shift?'':'<div class="note">O turno está fechado. Abre o turno no Caixa para registar o pagamento.</div>'}
  <button class="btn primary block" id="confirmPay" data-a="confirmPay">Confirmar pagamento</button>`);
  updatePayUI();
}
function updatePayUI(){
  const o=state.orders[ui.table];if(!o)return;
  const c=calc(o),btn=$('#confirmPay');if(!btn)return;
  const cash=ui.pay.method==='cash',recv=Number(ui.pay.received)||0;
  const cb=$('#cashbox');if(cb)cb.hidden=!cash;
  const tr=$('#troco');
  if(tr){
    if(recv>=c.total){tr.className='diff ok';tr.textContent=kz(recv-c.total)}
    else{tr.className='diff bad';tr.textContent=recv?'faltam '+kz(c.total-recv):'—'}
  }
  btn.disabled=!state.shift||(cash&&recv<c.total);
}
function receiptText(s){
  const W=34,line=(a,b)=>{a=String(a);b=String(b);return a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b};
  const o=["COSTA'S BURGERS","Obedece à tua Fome",'-'.repeat(W),dmy(s.t)+'  '+hhmm(s.t)+'  '+s.label,'Turno '+s.shiftN,'-'.repeat(W)];
  s.lines.forEach(l=>{o.push(line(l.qty+'x '+l.name,nf(l.qty*l.price)));if(l.items)l.items.forEach(i=>o.push(line('  '+i.qty+'x '+i.name,'')))});
  o.push('-'.repeat(W),line('Subtotal',nf(s.sub)));
  if(s.disc>0)o.push(line('Desconto'+(s.dwhy?' ('+s.dwhy+')':''),'-'+nf(s.disc)));
  o.push(line('TOTAL',kz(s.total)),line(METHODS[s.method],kz(s.method==='cash'?s.received:s.total)));
  if(s.method==='cash')o.push(line('Troco',kz(s.change)));
  o.push('IVA incluído ('+s.iva+'%): '+kz(ivaPart(s.total,s.iva)),'','Obrigado pela visita!');
  return o.join('\n');
}
function sheetReceipt(s){
  openSheet(`<h3>Pagamento registado</h3><pre id="rtxt">${esc(receiptText(s))}</pre><div class="acts"><button class="btn" data-a="copy" data-from="rtxt">Copiar talão</button><button class="btn primary" data-a="closeSheet">Concluir</button></div>`);
}
function copyText(id){
  const el=$('#'+id);if(!el)return;
  const done=()=>toast('Copiado');
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Copia manualmente.')};
  try{navigator.clipboard.writeText(el.textContent).then(done,fallback)}catch(e){fallback()}
}
function updateCounted(){
  const sh=state.shift,d=$('#diff'),b=$('#closeBtn');if(!sh||!d)return;
  const exp=sh.fundo+sumShift(sh.id).cash-expTot(sh),has=ui.counted!=='';
  const diff=(Number(ui.counted)||0)-exp;
  if(!has){d.className='diff';d.textContent='—'}
  else{d.className='diff '+(diff===0?'ok':'bad');d.textContent=(diff>0?'+':diff<0?'−':'')+kz(Math.abs(diff))}
  if(b)b.disabled=!has||openTables().length>0;
}
function sheetCloseShift(){
  const sh=state.shift,s=sumShift(sh.id),exp=sh.fundo+s.cash-expTot(sh),counted=Number(ui.counted)||0,diff=counted-exp;
  openSheet(`<h3>Fechar turno ${sh.n}?</h3><div class="kv"><div><span>Total do turno</span><b>${kz(s.total)}</b></div><div><span>Dinheiro esperado</span><b>${kz(exp)}</b></div><div><span>Dinheiro contado</span><b>${kz(counted)}</b></div><div class="big"><span>Diferença</span><b style="color:${diff===0?'var(--ok)':'var(--bad)'}">${diff>0?'+':diff<0?'−':''}${kz(Math.abs(diff))}</b></div></div>
  <div class="acts"><button class="btn" data-a="closeSheet">Voltar</button><button class="btn dark" data-a="closeShiftOk">Fechar turno</button></div>`);

function dayReport(day){
  const ss=sales.filter(s=>dayOf(s.t)===day);
  const sh=shifts.filter(c=>c.day===day).slice().sort((a,b)=>a.n-b.n||a.t-b.t);
  const by={cash:0,tpa:0,transf:0},prod={},hours=new Array(24).fill(0);
  let total=0,disc=0,iva=0;
  ss.forEach(s=>{
    by[s.method]=(by[s.method]||0)+s.total;total+=s.total;disc+=s.disc||0;iva+=ivaPart(s.total,s.iva);hours[new Date(s.t).getHours()]+=s.total;
    s.lines.forEach(l=>{
      const add=(nm,qt,rv)=>{const p=prod[nm]||(prod[nm]={name:nm,qty:0,rev:0});p.qty+=qt;p.rev+=rv};
      if(l.items&&l.orig){const f=l.price/l.orig;l.items.forEach(it=>add(it.name,it.qty*l.qty,it.price*it.qty*l.qty*f))}
      else add(l.name,l.qty,l.qty*l.price);
    });
  });
  const top=Object.keys(prod).map(k=>prod[k]).sort((a,b)=>b.qty-a.qty).slice(0,5);
  const diff=sh.reduce((a,c)=>a+c.diff,0);
  return {day:day,count:ss.length,total:total,disc:disc,iva:Math.round(iva),by:by,shifts:sh.map(c=>({n:c.n,count:c.count,total:c.total,diff:c.diff,exp:c.exp||0})),top:top,diff:diff,exp:sh.reduce((a,c)=>a+(c.exp||0),0),prods:Object.keys(prod).map(k=>({name:prod[k].name,qty:prod[k].qty,rev:Math.round(prod[k].rev)})),hours:hours};
}
function dayText(r,when){
  const W=34,line=(a,b)=>{a=String(a);b=String(b);return a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b};
  const sg=n=>(n>0?'+':n<0?'-':'')+kz(Math.abs(n));
  const o=["COSTA'S BURGERS",'FECHO DO DIA · '+dmy(when),'-'.repeat(W)];
  if(!r.shifts.length)o.push('Sem turnos fechados');
  r.shifts.forEach(c=>{o.push(line('Turno '+c.n+' ('+c.count+' vendas)',kz(c.total)));o.push(line('  diferença de caixa',sg(c.diff)))});
  o.push('-'.repeat(W),line('Dinheiro',kz(r.by.cash)),line('TPA / Multicaixa',kz(r.by.tpa)),line('Transferência',kz(r.by.transf)),'-'.repeat(W),line('Vendas',r.count),line('Descontos','-'+kz(r.disc)),line('IVA incluído',kz(r.iva)),line('TOTAL DO DIA',kz(r.total)));
  if(r.exp)o.push(line('Despesas pagas da caixa','-'+kz(r.exp)));
  if(r.shifts.length)o.push(line('Diferença de caixa',sg(r.diff)));
  if(r.top.length){o.push('','Mais vendidos');r.top.forEach(p=>o.push(line(p.qty+'x '+p.name,kz(p.rev))))}
  return o.join('\n');
}
function dayCard(day){
  const dc=days.find(d=>d.day===day);
  if(dc)return `<div class="card"><h3>Dia fechado</h3><div class="kv"><div><span>Fechado às</span><b>${hhmm(dc.t)}</b></div><div><span>Vendas</span><b>${dc.count}</b></div><div class="big"><span>Total do dia</span><b>${kz(dc.total)}</b></div></div><div class="row"><button class="btn primary grow" data-a="dayReport">Ver relatório</button><button class="btn grow" data-a="reopenDay">Reabrir dia</button></div></div>`;
  const r=dayReport(day),open=openTables().length,why=[];
  if(state.shift)why.push('Fecha o turno '+state.shift.n+' antes de fechar o dia.');
  if(open)why.push('Há '+open+' mesa(s) com pedido por pagar.');
  if(!r.count)why.push('Ainda não há vendas hoje.');
  return `<div class="card"><h3>Fecho do dia</h3><div class="kv"><div><span>Turnos fechados</span><b>${r.shifts.length} de 2</b></div><div><span>Vendas</span><b>${r.count}</b></div><div class="big"><span>Total até agora</span><b>${kz(r.total)}</b></div></div>${why.map(w=>`<div class="note">${esc(w)}</div>`).join('')}<button class="btn dark" data-a="closeDay" ${why.length?'disabled':''}>Fechar o dia</button></div>`;
}
function sheetDay(mode){
  const day=dayOf(Date.now()),dc=days.find(d=>d.day===day);
  const r=dc&&dc.report?dc.report:dayReport(day),when=dc?dc.t:Date.now();
  const txt=`<pre id="dtxt">${esc(dayText(r,when)+stDayBlock())}</pre>`;
  if(mode==='close')openSheet(`<h3>Fechar o dia?</h3>${txt}<div class="note">Depois de fechar, não dá para abrir mais turnos hoje, a menos que reabras o dia.</div><div class="acts"><button class="btn" data-a="closeSheet">Voltar</button><button class="btn dark" data-a="closeDayOk">Fechar o dia</button></div>`);
  else openSheet(`<h3>Relatório do dia</h3>${txt}<div class="acts"><button class="btn primary" data-a="x_wa" data-from="dtxt">Enviar por WhatsApp</button><button class="btn" data-a="copy" data-from="dtxt">Copiar</button><button class="btn" data-a="closeSheet">Fechar</button></div>`);
}
function sheetConfirm(msg,act,label){

/* ---------- ações ---------- */
function ensureOrder(t){return state.orders[t]||(state.orders[t]={lines:[],opened:Date.now(),disc:null,tid:t})}
function csv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Data','Hora','Turno','Local','Pagamento','Itens','Subtotal','Desconto','Total'].map(q).join(';')];
  sales.slice().reverse().forEach(s=>rows.push([dmy(s.t),hhmm(s.t),s.shiftN,s.label,METHODS[s.method]||'',s.lines.map(l=>l.qty+'x '+l.name+(l.items?' ('+l.items.map(i=>i.qty+'x '+i.name).join(' + ')+')':'')).join(' | '),s.sub,s.disc,s.total].map(q).join(';')));
  return '﻿'+rows.join('\r\n');
}
function act(a,d){
  if(a.indexOf('s_')===0){stAct(a,d);return}
  if(a.indexOf('x_')===0){xAct(a,d);return}
  switch(a){
    case 'go':if(!canGo(d.v))break;ui.view=d.v;ui.table=null;closeSheet();render();window.scrollTo(0,0);break;
    case 'openTable':ui.table=d.t;ui.view='order';render();window.scrollTo(0,0);break;
    case 'cat':ui.cat=d.c;render();break;
    case 'add':{const m=state.menu.find(x=>x.id===d.id);if(!m)break;const o=ensureOrder(ui.table);const l=o.lines.find(x=>x.id===m.id&&!x.note);if(l)l.qty++;else o.lines.push({id:m.id,name:m.name,price:m.price,qty:1,sent:0});save();render();break}
    case 'inc':case 'dec':{const o=state.orders[ui.table];if(!o)break;const l=o.lines.find(x=>lk(x)===d.id);if(!l)break;l.qty+=a==='inc'?1:-1;if(l.qty<=0)o.lines=o.lines.filter(x=>x!==l);else if(l.sent>l.qty)l.sent=l.qty;if(!o.lines.length)delete state.orders[ui.table];save();render();break}
    case 'toticket':{const t=$('#ticket');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'kitchen':sheetKitchen();break;
    case 'sent':{const o=state.orders[ui.table];if(o){o.lines.forEach(l=>{l.sent=l.qty});save()}closeSheet();render();toast('Marcado como enviado');break}
    case 'copy':copyText(d.from);break;
    case 'discount':sheetDiscount();break;
    case 'disct':ui.disc.type=d.k;sheetDiscountKeep();break;
    case 'discok':{const o=state.orders[ui.table];if(o){const v=Number(ui.disc.v)||0;o.disc=v>0?{type:ui.disc.type,v:v}:null;save()}closeSheet();render();break}
    case 'discoff':{const o=state.orders[ui.table];if(o){o.disc=null;save()}closeSheet();render();break}
    case 'clear':sheetConfirm('Anular o pedido de '+tlabel(ui.table)+'?','clearOk','Anular pedido');break;
    case 'clearOk':delete state.orders[ui.table];save();closeSheet();ui.view='tables';ui.table=null;render();toast('Pedido anulado');break;
    case 'pay':ui.pay={method:'cash',received:''};sheetPay();break;
    case 'paym':ui.pay.method=d.m;document.querySelectorAll('[data-a="paym"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===d.m)));updatePayUI();break;
    case 'recvq':{ui.pay.received=d.v;const r=$('#recv');if(r)r.value=d.v;updatePayUI();break}
    case 'confirmPay':{
      const t=ui.table,o=state.orders[t];if(!o||!state.shift)break;
      const c=calc(o),now=Date.now(),cash=ui.pay.method==='cash',recv=cash?(Number(ui.pay.received)||0):c.total;
      if(cash&&recv<c.total)break;
      const s={id:'s'+now,t:now,day:dayOf(now),shiftId:state.shift.id,shiftN:state.shift.n,table:t,label:tlabel(t),lines:o.lines.map(l=>l.combo?{name:l.name,price:l.price,qty:l.qty,items:l.items,orig:l.orig}:{mid:l.id,name:l.name,price:l.price,qty:l.qty}),sub:c.sub,disc:c.disc,dwhy:c.why||'',total:c.total,method:ui.pay.method,received:recv,change:recv-c.total,iva:state.iva,by:ui.user?ui.user.name:''};
      addSale(s);delete state.orders[t];save();ui.view='tables';ui.table=null;render();sheetReceipt(s);break;
    }
    case 'closeSheet':closeSheet();break;
    case 'lock':lock();break;
    case 'theme':sheetTheme();break;

      const de=document.documentElement,on=document.fullscreenElement||document.webkitFullscreenElement;

      const parts=noteParts(),i=parts.indexOf(d.c);

      ui.month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render();break;

      const sh=state.shift;if(!sh)break;

    case 'setup':setupOwner();break;
    case 'uadd':addUser();break;
    case 'pinChange':{const u=state.users.find(x=>x.id===d.id);if(!u)break;ui.pinFor=d.id;openSheet(`<h3>Novo PIN de ${esc(u.name)}</h3><div class="field"><label for="npin">PIN de 4 números</label><input class="in" id="npin" data-i="digits" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></div><div class="err" id="npin-err" role="alert"></div><div class="acts"><button class="btn" data-a="closeSheet">Voltar</button><button class="btn primary" data-a="pinSave">Guardar PIN</button></div>`);break}
    case 'pinSave':savePin();break;
    case 'udel':{const u=state.users.find(x=>x.id===d.id);if(!u)break;ui.delId=d.id;sheetConfirm('Remover '+u.name+'?','udelOk','Remover');break}
    case 'udelOk':{
      const u=state.users.find(x=>x.id===ui.delId);
      if(u&&(!ui.user||u.id!==ui.user.id)&&!(u.role==='dono'&&state.users.filter(x=>x.role==='dono').length<2)){state.users=state.users.filter(x=>x.id!==u.id);save();toast(u.name+' removido')}

    case 'turno':ui.turnoSel=Number(d.n);document.querySelectorAll('[data-a="turno"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.n===d.n)));break;
    case 'openShift':{if(days.some(d=>d.day===dayOf(Date.now()))){toast('O dia já está fechado. Reabre o dia para abrir outro turno.');break}const now=Date.now();state.shift={id:'T'+now,n:ui.turnoSel||1,start:now,fundo:Number(ui.fundo)||0};ui.fundo='';ui.counted='';save();render();toast('Turno '+state.shift.n+' aberto');break}
    case 'closeShift':sheetCloseShift();break;
    case 'closeShiftOk':{
      const sh=state.shift,s=sumShift(sh.id),exp=sh.fundo+s.cash-expTot(sh),counted=Number(ui.counted)||0,now=Date.now();
      addShiftClose({id:'c'+now,t:now,day:dayOf(now),shiftId:sh.id,n:sh.n,openedAt:sh.start,fundo:sh.fundo,count:s.n,total:s.total,cash:s.cash,tpa:s.tpa,transf:s.transf,expected:exp,exp:expTot(sh),expenses:(sh.exp||[]).map(e=>({desc:e.desc,amount:e.amount})),counted:counted,diff:counted-exp});
      state.shift=null;ui.counted='';save();closeSheet();render();toast('Turno fechado');break;

/* modelo: quantidade atual = contagem + compras − consumo das vendas − perdas */
function stModel(){
  const now=Date.now(),b=stk.base,res={ok:b.t>0,qty:{},ev:[],missing:{},avg:{},cut:false};
  if(!res.ok)return res;
  const byId={},byName={};
  state.menu.forEach(m=>{byId[m.id]=m;byName[String(m.name).toLowerCase()]=m});
  const addItem=(id,name,qt,t)=>{
    const m=(id&&byId[id])||byName[String(name).toLowerCase()],f=m&&stk.fichas[m.id];
    if(!f||!f.length){const k=m?m.name:name;res.missing[k]=(res.missing[k]||0)+qt;return}
    f.forEach(r=>res.ev.push({t:t,pid:r.pid,q:r.q*qt,k:'v'}));
  };
  const list=stSales();
  res.cut=!!list.cut;
  list.forEach(s=>{
    (s.lines||[]).forEach(l=>{
      if(l.items&&l.items.length)l.items.forEach(it=>addItem(it.id,it.name,it.qty*l.qty,s.t));
      else addItem(l.mid,l.name,l.qty,s.t);
    });
  });
  stk.produtos.forEach(p=>{res.qty[p.id]=Number(b.q[p.id])||0});
  smovs.forEach(m=>{
    if(m.t<=b.t||!(m.pid in res.qty))return;
    if(m.tipo==='entrada')res.qty[m.pid]+=m.qtd;
    else if(m.tipo==='saida')res.ev.push({t:m.t,pid:m.pid,q:m.qtd,k:'s'});
  });
  res.ev.forEach(e=>{if(e.pid in res.qty)res.qty[e.pid]-=e.q});
  const from=Math.max(b.t,now-7*DMS),span=Math.min(7,Math.max(1,(now-from)/DMS)),tot={};
  res.ev.forEach(e=>{if(e.t>=from)tot[e.pid]=(tot[e.pid]||0)+e.q});
  Object.keys(tot).forEach(k=>{res.avg[k]=tot[k]/span});
  return res;
}
function stStatus(p,M){
  const q=M.qty[p.id]||0,avg=M.avg[p.id]||0,dias=avg>0?q/avg:null;
  let lv='ok';
  if(q<=p.min)lv='bad';else if(dias!==null&&dias<=3)lv='warn';
  let sug=0;
  if(lv!=='ok'){const alvo=Math.max(avg*7,p.min*2),st=p.un==='un'?1:500;sug=Math.ceil(Math.max(0,alvo-q)/st)*st}
  return {q:q,avg:avg,dias:dias,lv:lv,sug:sug};
}

const stDias=s=>s.dias===null?'sem consumo':s.dias<1?'menos de 1 dia':nfd(Math.round(s.dias*10)/10)+' dias';
const stNet=m=>m.price-ivaPart(m.price,state.iva);

function stReport(M,per){
  const now=Date.now(),from=Math.max(per==='hoje'?sodT(now):sodT(now)-6*DMS,stk.base.t),rows={};
  stk.produtos.forEach(p=>{rows[p.id]={p:p,v:0,s:0}});
  M.ev.forEach(e=>{if(e.t>=from&&rows[e.pid])rows[e.pid][e.k]+=e.q});
  let rev=0,n=0;
  stSales().forEach(s=>{if(s.t<from)return;rev+=s.total-ivaPart(s.total,s.iva||0);n++});
  let cv=0,cs=0;
  Object.keys(rows).forEach(k=>{const r=rows[k],c=cpb(r.p);r.cv=r.v*c;r.cs=r.s*c;cv+=r.cv;cs+=r.cs});
  const list=Object.keys(rows).map(k=>rows[k]).filter(r=>r.v>0||r.s>0).sort((a,b)=>(b.cv+b.cs)-(a.cv+a.cs));
  return {from:from,rev:rev,n:n,cv:cv,cs:cs,list:list};
}

function sheetImport(){
  openSheet(`<h3>Importar do app Fichas técnicas</h3><p class="sub" style="margin:0">No app Fichas técnicas, toca em Exportar e escolhe aqui o ficheiro. Os ingredientes viram produtos do estoque e cada ficha liga-se ao item do menu com o mesmo nome.</p><div class="field"><label for="imp-f">Ficheiro exportado (.json)</label><input class="in txt" type="file" id="imp-f" accept=".json,application/json" data-s="impf"></div><div id="imp-r" class="sub" role="status"></div><div class="acts"><button class="btn primary" data-a="closeSheet">Fechar</button></div>`);

function stImport(txt){
  const d=JSON.parse(txt);
  if(!d||!Array.isArray(d.items))throw new Error('formato');
  const nm=s=>String(s||'').toLowerCase().replace(/\(exemplo\)/g,'').replace(/\s+/g,' ').trim();
  let newP=0,linked=0;const miss=[];
  d.items.forEach(f=>{
    if(!f||!Array.isArray(f.ing))return;
    const m=state.menu.find(x=>nm(x.name)===nm(f.n));
    if(!m){miss.push(String(f.n||'sem nome'));return}
    const y=Math.max(Number(f.y)||1,1),rows=[];
    f.ing.forEach(i=>{
      if(!i||!i.n)return;
      const u=['g','ml','un'].indexOf(i.u)>=0?i.u:'g';
      let p=stk.produtos.find(x=>nm(x.nome)===nm(i.n)&&x.un===u);
      if(!p){p={id:'p'+stNew(),nome:String(i.n).slice(0,40),cat:'outros',un:u,custo:Number(i.p)||0,min:0};stk.produtos.push(p);newP++}
      else if(!p.custo&&Number(i.p))p.custo=Number(i.p);
      const q=(Number(i.q)||0)/y;
      if(q>0)rows.push({pid:p.id,q:Math.round(q*1000)/1000});
    });
    if(rows.length){stk.fichas[m.id]=rows;linked++}
  });
  stSave();ui.st.fd=null;
  return {newP:newP,linked:linked,miss:miss};
}

function stAct(a,d){
  const S_=ui.st;
  switch(a){
    case 's_tab':S_.tab=d.t;closeSheet();render();window.scrollTo(0,0);break;
    case 's_seed':{
      ST_SEED.forEach(r=>{if(!stk.produtos.some(p=>p.nome.toLowerCase()===r[0].toLowerCase()))stk.produtos.push({id:'p'+stNew(),nome:r[0],cat:r[1],un:r[2],custo:0,min:0})});
      stSave();S_.tab='prod';render();toast('Lista criada. Corrige os custos e os mínimos');break;
    }
    case 's_count':sheetCount(stModel());break;
    case 's_countok':{
      const M=stModel(),now=Date.now(),nq={};
      stk.produtos.forEach(p=>{
        const el=document.querySelector('[data-s="cnt"][data-id="'+p.id+'"]'),v=toBase(p,Math.max(0,stN(el&&el.value))),cur=M.ok?(M.qty[p.id]||0):0,dlt=Math.round((v-cur)*1000)/1000;
        nq[p.id]=v;
        if(M.ok&&dlt!==0)stMov({id:'v'+stNew(),t:now-1,pid:p.id,tipo:'contagem',qtd:dlt,custo:p.custo,motivo:'Contagem',by:ui.user?ui.user.name:''});
      });
      stk.base={t:now,q:nq};stSave();stSubSales();closeSheet();render();toast('Contagem guardada');break;
    }
    case 's_list':sheetList(stModel());break;
    case 's_buy':S_.mvp=d.id;S_.tab='mov';closeSheet();render();window.scrollTo(0,0);break;
    case 's_mvsave':{
      const p=stProd(($('#sm-p')||{}).value),tp=$('#sm-t').value,q=stN($('#sm-q').value);
      if(!p||q<=0){toast('Escolhe o produto e uma quantidade maior que zero');break}
      const b=toBase(p,q),c=stN($('#sm-c').value);
      if(tp==='entrada'&&c>0){p.custo=c;stSave()}
      stMov({id:'v'+stNew(),t:Date.now(),pid:p.id,tipo:tp,qtd:b,custo:p.custo,motivo:($('#sm-m').value||'').trim().slice(0,40)||(tp==='entrada'?'Compra':'Perda ou quebra'),by:ui.user?ui.user.name:''});
      S_.mvp=p.id;render();toast((tp==='entrada'?'Entrada':'Saída')+' registada: '+fq(p,b)+' de '+p.nome);break;
    }
    case 's_psave':{
      const nome=($('#sp-n').value||'').trim().slice(0,40);
      if(!nome){toast('Escreve o nome do produto');break}
      const un=$('#sp-u').value,cat=$('#sp-c').value,custo=Math.max(0,stN($('#sp-p').value)),ed=S_.ed?stProd(S_.ed):null;
      const min=toBase({un:un},Math.max(0,stN($('#sp-m').value)));
      if(ed){ed.nome=nome;ed.cat=cat;ed.un=un;ed.custo=custo;ed.min=min;S_.ed=null;toast('Produto atualizado')}
      else{stk.produtos.push({id:'p'+stNew(),nome:nome,cat:cat,un:un,custo:custo,min:min});toast(nome+' adicionado')}
      stSave();render();break;
    }
    case 's_pedit':S_.ed=d.id;render();window.scrollTo(0,0);break;
    case 's_pcancel':S_.ed=null;render();break;
    case 's_pdel':{const p=stProd(d.id);if(!p)break;S_.delId=d.id;sheetConfirm('Remover '+p.nome+'? Ele sai também das fichas.','s_pdelok','Remover');break}
    case 's_pdelok':{
      const id=S_.delId;
      stk.produtos=stk.produtos.filter(p=>p.id!==id);
      Object.keys(stk.fichas).forEach(k=>{stk.fichas[k]=stk.fichas[k].filter(r=>r.pid!==id);if(!stk.fichas[k].length)delete stk.fichas[k]});
      delete stk.base.q[id];S_.fd=null;S_.delId=null;stSave();closeSheet();render();toast('Produto removido');break;
    }
    case 's_fsel':S_.fm=d.id;S_.fd=null;render();break;
    case 's_fadd':if(S_.fd){S_.fd.rows.push({pid:'',q:0});render()}break;
    case 's_frm':if(S_.fd){S_.fd.rows.splice(+d.i,1);render()}break;
    case 's_fsave':{
      if(!S_.fd)break;
      const map={};
      S_.fd.rows.forEach(r=>{if(r.pid&&r.q>0&&stProd(r.pid))map[r.pid]=Math.round(((map[r.pid]||0)+r.q)*1000)/1000});
      const rows=Object.keys(map).map(k=>({pid:k,q:map[k]}));
      if(rows.length)stk.fichas[S_.fd.mid]=rows;else delete stk.fichas[S_.fd.mid];
      S_.fd=null;stSave();render();toast(rows.length?'Ficha guardada':'Ficha sem ingredientes removida');break;
    }
    case 's_fclear':if(S_.fd){delete stk.fichas[S_.fd.mid];S_.fd=null;stSave();render();toast('Ficha removida')}break;
    case 's_import':sheetImport();break;
    case 's_per':S_.per=d.p;render();break;
    case 's_csv':{
      const M=stModel(),now=Date.now();let rows,name;
      if(d.k==='cons'){
        if(!M.ok)break;
        const R=stReport(M,S_.per);
        rows=[['Produto','Categoria','Unidade','Nas vendas','Perdas e saídas','Custo (Kz)']].concat(R.list.map(r=>[r.p.nome,r.p.cat,r.p.un,String(Math.round(r.v*100)/100).replace('.',','),String(Math.round(r.s*100)/100).replace('.',','),Math.round(r.cv+r.cs)]));
        name='consumo-costas-'+dayOf(now)+'.csv';
      }else{
        rows=[['Data','Hora','Produto','Tipo','Quantidade','Unidade','Motivo','Registado por']].concat(smovs.slice().reverse().map(m=>{const p=stProd(m.pid);return [dmy(m.t),hhmm(m.t),p?p.nome:'(removido)',m.tipo,String(Math.round(m.qtd*100)/100).replace('.',','),p?p.un:'',m.motivo||'',m.by||'']}));
        name='movimentos-estoque-'+dayOf(now)+'.csv';
      }
      if(rows.length<2){toast('Ainda não há dados para exportar');break}
      if(dl)dl.save({filename:name,data:stCsvText(rows)}).then(()=>toast('Ficheiro guardado'),e=>{if(!e||e.code!=='declined')toast('Não foi possível guardar o ficheiro')});
      else toast('Exportação indisponível neste ecrã');
      break;
    }
  }
}

  const t=e.target,k=t.dataset&&t.dataset.s;if(!k)return;
  const S_=ui.st;
  if(k==='frq'&&S_.fd&&S_.fd.rows[+t.dataset.i]){S_.fd.rows[+t.dataset.i].q=Math.max(0,stN(t.value));stFichaSum()}

    }).catch(()=>{if(out)out.textContent='Ficheiro inválido. Escolhe uma cópia exportada pelo app Fichas técnicas.'});

});
function stFichaSum(){

});

/* ---------- app instalado: ficheiros, WhatsApp e cópia de segurança ---------- */
let lsWarned=0;
function lsFull(){
  if(Date.now()-lsWarned<60000)return;
  lsWarned=Date.now();
  try{toast('Memória do aparelho cheia. Faz uma cópia de segurança em Definições.')}catch(e){}
}
function saveFileLocal(o){
  return new Promise((resolve,reject)=>{
    try{
      const type=/\.json$/i.test(o.filename)?'application/json':'text/csv';
      const file=new File([o.data],o.filename,{type:type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:o.filename}).then(resolve,e=>reject(e&&e.name==='AbortError'?{code:'declined'}:e));
        return;
      }
      const url=URL.createObjectURL(new Blob([o.data],{type:type+';charset=utf-8'}));
      const a=document.createElement('a');a.href=url;a.download=o.filename;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);resolve();
    }catch(e){reject(e)}
  });
}
function waShare(id){
  const el=$('#'+id);if(!el)return;
  const n=String(state.wa||'').replace(/\D/g,'');
  const url='https://wa.me/'+n+'?text='+encodeURIComponent(el.textContent);
  const w=window.open(url,'_blank');
  if(!w)location.href=url;
}
function stDayBlock(){
  if(!stk.produtos.length||!(stk.base.t>0))return '';
  const M=stModel(),R=stReport(M,'hoje'),W=34;
  const line=(a,b)=>{a=String(a);b=String(b);return a.slice(0,Math.max(1,W-b.length-1)).padEnd(W-b.length)+b};
  const o=['','-'.repeat(W),'ESTOQUE',line('Custo dos ingredientes',kz(R.cv))];
  if(R.rev>0&&R.cv>0)o.push(line('Custo sobre a faturação',nfd(Math.round(R.cv/R.rev*1000)/10)+'%'));
  if(R.cs>0)o.push(line('Perdas e saídas',kz(R.cs)));
  const rep=stk.produtos.map(p=>({p:p,s:stStatus(p,M)})).filter(r=>r.s.lv!=='ok').sort((a,b)=>a.p.nome.localeCompare(b.p.nome,'pt'));
  if(rep.length){
    o.push('A repor:');
    rep.slice(0,8).forEach(r=>o.push('- '+r.p.nome+(r.s.sug>0?': '+fq(r.p,r.s.sug):'')));
    if(rep.length>8)o.push('+ '+(rep.length-8)+' produtos');
  }else o.push('Nada a repor');
  const miss=Object.keys(M.missing);
  if(miss.length)o.push('Sem ficha: '+miss.slice(0,4).join(', '));
  return o.join('\n');
}
let xBk=null;
function xAct(a,d){
  switch(a){
    case 'x_wa':waShare(d.from);break;
    case 'x_bkexport':{
      const data=JSON.stringify({app:'costas-pos',v:1,t:Date.now(),state:state,sales:sales,shifts:shifts,days:days,stk:stk,smovs:smovs});
      saveFileLocal({filename:'costas-pos-copia-'+dayOf(Date.now())+'.json',data:data}).then(()=>toast('Cópia guardada'),e=>{if(!e||e.code!=='declined')toast('Não foi possível guardar a cópia')});
      break;
    }
    case 'x_bkimport':{const f=$('#bk-file');if(f)f.click();break}
    case 'x_bkok':{
      if(!xBk)break;
      lsSet(LS+'-state',xBk.state);lsSet(LS+'-sales',xBk.sales);lsSet(LS+'-shifts',xBk.shifts);lsSet(LS+'-days',xBk.days);
      lsSet(SLS,normStk(xBk.stk));lsSet(SLS+'-movs',Array.isArray(xBk.smovs)?xBk.smovs:[]);
      location.reload();break;
    }
  }
}

  if(t.id==='bk-file'&&t.files&&t.files[0]){

      if(!o||o.app!=='costas-pos'||!o.state||!Array.isArray(o.sales)||!Array.isArray(o.days)||!Array.isArray(o.shifts))throw new Error('formato');
      xBk=o;
      sheetConfirm('Restaurar a cópia de '+dmy(o.t)+'? Isto substitui todos os dados deste aparelho.','x_bkok','Restaurar');
    }).catch(()=>toast('Esse ficheiro não é uma cópia do POS'));
    t.value='';
  }
});

  if(t.dataset&&t.dataset.i==='wanum'){state.wa=String(t.value).replace(/\D/g,'');save()}
});

render();
attach();
